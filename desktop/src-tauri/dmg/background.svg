<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584">
  <!-- The disk image's window, drawn as the docs' and humanfia.ai's heroes are: a ruled sheet,
       one square, one circle, and the move between them. The app sits in the pink square at
       (210, 196) and Applications in the cyan disc at (510, 196), as tauri.conf.json places
       their 128-point icons, each with its label inside its plane; the arrow says which way.
       Finder keeps a window with a picture light, and its labels ink, so the sheet is the light
       paper alone, kept 48 points clear of the window's rounded edges.

       Under it, the plate `#unsigned`: how to open an app macOS cannot check, the first time.
       `pnpm dmg-background` makes background.tiff, 720 x 584 with the plate, and
       background-signed.tiff, 720 x 456 without it for an app signed with a Developer ID, each
       at 1x and 2x, from this. Finder draws it under its title bar, 28 points that the window
       sizes in tauri.conf.json and publish.yml add to it. -->
  <rect width="720" height="584" fill="#f4f8f9"/>

  <!-- The sheet: ruled, and marked at its top corners. -->
  <g stroke="#141a1f" stroke-opacity="0.07">
    <path d="M120 24V560M240 24V560M360 24V560M480 24V560M600 24V560"/>
    <path d="M24 120H696M24 240H696M24 360H696M24 480H696"/>
  </g>
  <g stroke="#141a1f" stroke-opacity="0.38" fill="none">
    <circle cx="48" cy="48" r="5"/><path d="M39 48h18M48 39v18"/>
    <circle cx="672" cy="48" r="5"/><path d="M663 48h18M672 39v18"/>
  </g>

  <!-- Where the app is: a square plane, holding the icon and its label. -->
  <rect x="110" y="108" width="200" height="200" fill="#ec6fa3" fill-opacity="0.16"/>
  <path d="M110 108h32M110 108v32" stroke="#b83a72" stroke-width="2" fill="none"/>

  <!-- Where it goes: a disc holding the icon and its label, a compass ring round it ticked
       every 15 degrees, and a green square riding the ring. -->
  <circle cx="510" cy="208" r="104" fill="#1fb3c7" fill-opacity="0.18"/>
  <circle cx="510" cy="208" r="124" fill="none" stroke="#141a1f" stroke-width="1.2"/>
  <g stroke="#141a1f" stroke-width="1" transform="translate(510 208)">
    <path id="tick" d="M0 -124v8"/>
    <use href="#tick" transform="rotate(15)"/><use href="#tick" transform="rotate(30)"/>
    <use href="#tick" transform="rotate(60)"/><use href="#tick" transform="rotate(75)"/>
    <use href="#tick" transform="rotate(90)"/><use href="#tick" transform="rotate(105)"/>
    <use href="#tick" transform="rotate(120)"/><use href="#tick" transform="rotate(135)"/>
    <use href="#tick" transform="rotate(150)"/><use href="#tick" transform="rotate(165)"/>
    <use href="#tick" transform="rotate(180)"/><use href="#tick" transform="rotate(195)"/>
    <use href="#tick" transform="rotate(210)"/><use href="#tick" transform="rotate(225)"/>
    <use href="#tick" transform="rotate(240)"/><use href="#tick" transform="rotate(255)"/>
    <use href="#tick" transform="rotate(285)"/><use href="#tick" transform="rotate(300)"/>
    <use href="#tick" transform="rotate(315)"/><use href="#tick" transform="rotate(330)"/>
    <use href="#tick" transform="rotate(345)"/>
  </g>
  <rect x="-7" y="-131" width="14" height="14" fill="#76b900" transform="translate(510 208) rotate(45)"/>

  <!-- The move: a bar cut across, and its head. -->
  <path d="M322 191H352V201H322Z" fill="#141a1f"/>
  <path d="M348 178L374 196L348 214Z" fill="#141a1f"/>

  <!-- The base the drawing stands on, and what it says. -->
  <rect x="48" y="364" width="624" height="6" fill="#141a1f"/>
  <rect x="48" y="396" width="14" height="4" fill="#76b900"/>
  <rect x="62" y="396" width="14" height="4" fill="#1fb3c7"/>
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="#141a1f">
    <text x="88" y="402" font-weight="700">DRAG TO APPLICATIONS</text>
    <text x="672" y="402" text-anchor="end" fill-opacity="0.55">humanfia.ai</text>
  </g>

  <!-- The first open, where the app is signed ad hoc: an ink plate, its steps numbered in gold. -->
  <g id="unsigned">
    <rect x="48" y="424" width="624" height="112" fill="#141a1f"/>
    <rect x="48" y="424" width="6" height="112" fill="#d9a440"/>
    <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="2" fill="#d9a440" font-weight="700">
      <text x="76" y="449">FIRST OPEN</text>
      <text x="76" y="475">1</text>
      <text x="76" y="497">2</text>
      <text x="76" y="519">OR</text>
    </g>
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#f4f8f9">
      <text x="196" y="449" fill-opacity="0.6">humanize is not signed by Apple yet, so macOS stops it once.</text>
      <text x="104" y="475">Open humanize from Applications, and choose <tspan font-weight="700">Done</tspan>.</text>
      <text x="104" y="497">System Settings → Privacy &amp; Security → <tspan font-weight="700">Open Anyway</tspan>.</text>
    </g>
    <text x="104" y="519" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#f4f8f9">xattr -dr com.apple.quarantine /Applications/humanize.app</text>
  </g>
</svg>

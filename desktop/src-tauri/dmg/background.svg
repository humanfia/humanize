<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!-- The disk image's window, drawn as the docs' and humanfia.ai's heroes are: a ruled sheet,
       one square, one circle, and the move between them. The app sits on the pink square at
       (180, 180) and Applications in the cyan disc at (480, 180), as tauri.conf.json places
       their 128-point icons; the arrow says which way. Finder keeps a window with a picture
       light, and its labels ink, so the sheet is the light paper alone.
       `pnpm dmg-background` makes background.tiff, at 1x and 2x, from this. -->
  <rect width="660" height="400" fill="#f4f8f9"/>

  <!-- The sheet: ruled, ticked along two edges, marked at its corners. -->
  <g stroke="#141a1f" stroke-opacity="0.07">
    <path d="M60 16V384M120 16V384M240 16V384M300 16V384M360 16V384M420 16V384M540 16V384M600 16V384"/>
    <path d="M16 60H644M16 120H644M16 240H644M16 300H644"/>
  </g>
  <g stroke="#141a1f" stroke-opacity="0.38">
    <path d="M20 400v-6M40 400v-6M60 400v-10M80 400v-6M100 400v-6M120 400v-14M140 400v-6M160 400v-6M180 400v-10M200 400v-6M220 400v-6M240 400v-14M260 400v-6M280 400v-6M300 400v-10M320 400v-6M340 400v-6M360 400v-14M380 400v-6M400 400v-6M420 400v-10M440 400v-6M460 400v-6M480 400v-14M500 400v-6M520 400v-6M540 400v-10M560 400v-6M580 400v-6M600 400v-14M620 400v-6M640 400v-6"/>
    <path d="M0 20h6M0 40h6M0 60h10M0 80h6M0 100h6M0 120h14M0 140h6M0 160h6M0 180h10M0 200h6M0 220h6M0 240h14M0 260h6M0 280h6M0 300h10M0 320h6M0 340h6M0 360h14M0 380h6"/>
    <g fill="none">
      <circle cx="36" cy="36" r="5"/><path d="M27 36h18M36 27v18"/>
      <circle cx="624" cy="364" r="5"/><path d="M615 364h18M624 355v18"/>
    </g>
  </g>

  <!-- Where the app is: a square plane, set on the sheet's own rules. -->
  <rect x="96" y="96" width="168" height="168" fill="#ec6fa3" fill-opacity="0.16"/>
  <path d="M96 96h28M96 96v28" stroke="#b83a72" stroke-width="2" fill="none"/>

  <!-- Where it goes: a disc, a compass ring round it ticked every 15 degrees, and a green
       square riding the ring. -->
  <circle cx="480" cy="180" r="92" fill="#1fb3c7" fill-opacity="0.18"/>
  <circle cx="480" cy="180" r="112" fill="none" stroke="#141a1f" stroke-width="1.2"/>
  <g stroke="#141a1f" stroke-width="1" transform="translate(480 180)">
    <path id="tick" d="M0 -112v8"/>
    <use href="#tick" transform="rotate(15)"/><use href="#tick" transform="rotate(30)"/>
    <use href="#tick" transform="rotate(60)"/><use href="#tick" transform="rotate(75)"/>
    <use href="#tick" transform="rotate(90)"/><use href="#tick" transform="rotate(105)"/>
    <use href="#tick" transform="rotate(120)"/><use href="#tick" transform="rotate(135)"/>
    <use href="#tick" transform="rotate(150)"/><use href="#tick" transform="rotate(165)"/>
    <use href="#tick" transform="rotate(180)"/><use href="#tick" transform="rotate(195)"/>
    <use href="#tick" transform="rotate(210)"/><use href="#tick" transform="rotate(225)"/>
    <use href="#tick" transform="rotate(240)"/><use href="#tick" transform="rotate(255)"/>
    <use href="#tick" transform="rotate(285)"/><use href="#tick" transform="rotate(300)"/>
    <use href="#tick" transform="rotate(315)"/><use href="#tick" transform="rotate(330)"/>
    <use href="#tick" transform="rotate(345)"/>
  </g>
  <rect x="-7" y="-119" width="14" height="14" fill="#76b900" transform="translate(480 180) rotate(45)"/>

  <!-- The move: a bar cut across, and its head. -->
  <path d="M280 175H330V185H280Z" fill="#141a1f"/>
  <path d="M326 160L356 180L326 200Z" fill="#141a1f"/>

  <!-- The base the drawing stands on, and what it says. -->
  <rect x="36" y="318" width="588" height="6" fill="#141a1f"/>
  <rect x="36" y="347" width="14" height="4" fill="#76b900"/>
  <rect x="50" y="347" width="14" height="4" fill="#1fb3c7"/>
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2.2" fill="#141a1f">
    <text x="76" y="353" font-weight="700">DRAG TO APPLICATIONS</text>
    <text x="584" y="353" text-anchor="end" fill-opacity="0.55">humanfia.ai</text>
  </g>
</svg>

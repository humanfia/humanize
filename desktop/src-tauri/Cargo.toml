# The macOS app: a window around `hmz web`. Its version is tauri.conf.json's alone, which a
# release sets; this one stays 0.0.0, as pyproject.toml does on `main`.

[package]
name = "humanize"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "humanize_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No default features: the window, the menus, the tray icon and the webview, and nothing this
# app never asks.
tauri = { version = "2", default-features = false, features = ["tray-icon", "wry"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Its own TLS and the system's proxy, without the zip only Tauri 1's Windows updates came in:
# Windows installs from the signed setup.exe itself.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-window-state = "2"
libc = "0.2"
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
# What generate_context! writes the updater's configuration out with.
serde_json = "1"
shared_child = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
# Installing hmz: uv's release fetched over rustls, trusting what the keychain trusts, checked
# and unpacked; and a daemon's note read, with serde_json above.
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The update's alerts: CFUserNotification, which never holds up a quit as a sheet would.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDate", "CFDictionary", "CFString", "CFURL", "CFUserNotification"] }
# Notifications the page asks for: UNUserNotificationCenter, and a delegate told of a click.
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(windows)'.dependencies]
# Notifications the page asks for: toasts, told of a click.
tauri-winrt-notification = "0.8"
# The update's alerts: a task dialog, closed as the app quits.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

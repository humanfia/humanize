<!doctype html>
<!-- The app's own page: a splash while hmz is installed and hmz web starts, and what went wrong
     where it cannot. The window is dragged, and zoomed, by any of it but what is clicked or
     selected. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>humanize</title>
    <link rel="stylesheet" href="ui.css" />
    <script src="ui.js" defer></script>
  </head>
  <body data-tauri-drag-region="deep">
    <main data-state="starting">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <polygon class="ink" points="12,16 32,16 62,50 32,84 12,84 42,50" />
        <polygon class="green" points="60,84 94,84 94,64 60,74" />
      </svg>
      <p class="starting" role="status">Starting</p>
      <h1 id="title"></h1>
      <p id="lead"></p>
      <div class="progress" role="status">
        <div class="bar"><span></span></div>
        <p id="step"></p>
        <p id="line"></p>
      </div>
      <pre id="detail" data-tauri-drag-region="false"></pre>
      <div class="actions">
        <button class="btn primary" id="retry" type="button">Retry</button>
        <button class="btn" id="keep" type="button">Continue</button>
        <button class="btn" id="update_now" type="button">Update now</button>
        <a class="btn quiet" id="docs" href="https://docs.humanfia.ai/humanize/user/desktop#troubleshooting">Documentation</a>
      </div>
    </main>
  </body>
</html>

# What CI pins, kept fresh. Monthly and grouped: one pull request per ecosystem when
# something moves, rather than a stream of them. And a week behind: a release that turns out to
# be broken, or somebody else's, is usually pulled within days, before it is proposed here.

version: 2

updates:
  # The workflows.
  - package-ecosystem: github-actions
    directory: /
    # No labels: this repository manages nothing by them.
    labels: []
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    labels: []
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The hooks pre-commit fetches for itself. ruff and pyright are `uv`'s, above.
  - package-ecosystem: pre-commit
    directory: /
    labels: []
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # The documentation site, which is the one part of this repository that is not Python.
  - package-ecosystem: npm
    directory: /docs
    labels: []
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: docs

name: Set up uv
description: >-
  uv, Python 3.12, and this project's environment with every extra, made from uv.lock. The
  checkout is the caller's.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        python-version: "3.12"
        # Pull requests restore what `main` saved and write nothing, so a lockfile change
        # does not have every job racing to upload the same cache.
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    - name: uv sync --frozen --all-extras
      shell: bash
      run: uv sync --frozen --all-extras

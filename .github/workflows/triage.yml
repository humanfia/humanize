# Checks a pull request's title and labels the pull request, and keeps the repository's labels
# in step with labels.yml.
#
# The pull request jobs run on `pull_request_target` because a pull request from a fork gets a
# `pull_request` token that cannot write, and so cannot be labelled. That trigger runs this
# file as it is on main, with a token that can write to the repository -- so neither job checks
# out, installs or runs anything from the pull request. They read its title and the list of
# files it changes through the API, and nothing else. Keep it that way.
#
# For the same reason, a change to this file or to labeler.yml takes effect on the pull
# requests after it merges, never on the one that makes it.

name: triage

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- reads the title and paths only; see above
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/triage.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Conventional Commits types a title may start with. Each has a `type/<type>` label in
  # labels.yml, and CONTRIBUTING.md lists them.
  TYPES: |
    build
    chore
    ci
    docs
    feat
    fix
    perf
    refactor
    revert
    style
    test

jobs:
  title:
    name: title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # the title, and the pull request it belongs to
    steps:
      - name: The title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ env.TYPES }}
          # Squashing a pull request of one commit writes that commit's message to main, not
          # the title, so hold the commit to the same form.
          validateSingleCommit: true

  label:
    name: label
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # labeler.yml, from main
      pull-requests: write # the labels
    steps:
      # With nothing checked out, labeler.yml is read through the API, from main. An area the
      # pull request no longer touches loses its label.
      - name: area/* from the paths it changes
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

      # The title is read through the API rather than from the event: a re-run then sees the
      # title as it is now, and the author's text never passes through `${{ }}` into a script.
      - name: type/* and breaking from the title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .title)
          have=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name')

          # The title job's parser reads a title the same way: a greedy scope, and `!` for
          # breaking (conventional-changelog-conventionalcommits' header patterns).
          declare -A want=()
          re='^([a-z]+)(\(.*\))?(!?): '
          if [[ $title =~ $re ]] && grep -qxF -- "${BASH_REMATCH[1]}" <<<"$TYPES"; then
            want["type/${BASH_REMATCH[1]}"]=1
            [[ -z ${BASH_REMATCH[3]} ]] || want[breaking]=1
          fi

          # Take off what an earlier title put on, then put on what this one says and the pull
          # request does not have yet. A title that is not a Conventional Commit wants nothing.
          while IFS= read -r label; do
            case $label in type/* | breaking) ;; *) continue ;; esac
            if [[ -v want[$label] ]]; then
              unset "want[$label]"
              continue
            fi
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/$(jq -rn --arg l "$label" '$l | @uri')" >/dev/null
            echo "removed $label"
          done <<<"$have"

          for label in "${!want[@]}"; do
            gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$label" >/dev/null
            echo "added $label"
          done

  labels:
    name: labels
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # labels.yml
      issues: write # the repository's labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false

      - name: Sync labels.yml to the repository's labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ github.token }}
          yaml-file: .github/labels.yml
          skip-delete: true

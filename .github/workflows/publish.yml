# Publishes a release: a push to `main` that merged a release pull request, which release.yml
# opens, tags it and publishes it. docs/contributing/releasing.md is how a maintainer gets there.
#
# PyPI trusts this file by its name and the `pypi` environment, through trusted publishing:
# no token is stored anywhere, so renaming this file or the environment stops releases until
# the publisher on PyPI is changed to match.

name: publish

on:
  push:
    branches: [main]
  # Builds and checks what a release would publish, and publishes nothing.
  workflow_dispatch:

permissions: {}

# One run at a time, and never one cancelled half-way through an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: find the release
    if: github.repository == 'humanfia/humanize' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # which pull request this commit merged
    outputs:
      tag: ${{ steps.found.outputs.tag }}
    steps:
      # A release is the merge of this repository's own `release/v*` branch, and its tag is
      # what the branch is called after `release/`.
      - name: Find the release pull request this commit merged
        id: found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -r \
            --arg repo "$GITHUB_REPOSITORY" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == $repo)][0].head.ref // ""')"
          if [[ "$branch" == release/v* ]]; then
            echo "tag=${branch#release/}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # On a release, or a dry run by hand. `!cancelled()` because a dry run skips `check`.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.check.outputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Nothing restored from a cache another run wrote goes into what is published.
          enable-cache: false

      - name: The version is the tag's
        if: needs.check.outputs.tag != ''
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          expected="$(sed -E 's/^v//; s/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/' <<<"$TAG")"
          actual="$(uv version --short)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::pyproject.toml says $actual, and $TAG is $expected"
            exit 1
          fi

      - name: Build the wheel and the sdist
        run: uv build --no-sources

      - name: PyPI will render the description
        run: uvx twine@7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hmz
    permissions:
      id-token: write # traded with PyPI for an upload token, and what the attestations are signed by
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  release:
    name: publish the release
    # After PyPI, so the release never offers files PyPI refused.
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are every commit since the previous release's tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          git log --no-merges --format='- %s (%h)' ${previous:+"$previous..HEAD"} \
            | grep -v '^- chore(release): ' > "$RUNNER_TEMP/notes.md" || true
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" --repo "$GITHUB_REPOSITORY"

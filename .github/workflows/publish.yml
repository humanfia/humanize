# Publishes a release: a push to a `release/X.Y` branch that merged its release pull request,
# which release.yml opens. release-please tags it and drafts the GitHub release from
# CHANGELOG.md; this builds the package and the macOS app's disk image, publishes the package to
# PyPI, then publishes the GitHub release with both attached. Every other push to such a branch
# does nothing.
# docs/contributing/releasing.md has the rest.
#
# PyPI trusts this file by its name and the `pypi` environment, through trusted publishing:
# no token is stored anywhere, so renaming this file or the environment stops releases until
# the publisher on PyPI is changed to match.

name: publish

on:
  push:
    branches: ["release/**"]

permissions: {}

# One run at a time a branch, and never one cancelled half-way through an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'humanfia/humanize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the draft release
      pull-requests: write # to mark the release pull request released
      issues: write # the `autorelease:` labels it finds its pull requests by
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Releases only: release.yml opens the release pull request, by hand.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Nothing restored from a cache another run wrote goes into what is published.
          enable-cache: false

      - name: Build the wheel and the sdist
        run: uv build --no-sources

      - name: PyPI will render the description
        run: uvx twine@7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hmz
    permissions:
      id-token: write # traded with PyPI for an upload token, and what the attestations are signed by
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  # The macOS app, one disk image for Apple silicon and Intel. Signed ad hoc, unless the
  # repository holds an Apple Developer ID in its `APPLE_*` secrets: then signed with it and
  # notarized.
  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # what the attestation is signed by
      attestations: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, here or below: nothing restored from what another run wrote goes into what
      # is published.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm install --frozen-lockfile

      # The version is the tag's. A pre-release's bundle version is its X.Y.Z alone: macOS
      # reads that as numbers.
      - name: Build the disk image
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only the ones set: the bundler reads an empty one as one given.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            secret="SECRET_$name"
            if [[ -n "${!secret}" ]]; then export "$name=${!secret}"; fi
            unset "$secret"
          done
          version="${TAG#v}"
          config="$(jq -nc --arg v "$version" --arg b "${version%%-*}" \
            '{version: $v, bundle: {macOS: {bundleVersion: $b}}}')"
          pnpm tauri build --target universal-apple-darwin --bundles dmg --config "$config"
          mkdir -p ../dist
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "../dist/humanize-$version-macos-universal.dmg"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop
          path: dist/
          if-no-files-found: error

  release:
    name: publish the release
    # After PyPI, so the release never offers files PyPI refused, and after the app.
    needs: [release-please, publish, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to attach the files and take the release out of draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to tell whether this is the newest release.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # The disk image beside the wheel and the sdist.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: dist/

      # An alpha, beta or rc is a pre-release; the latest release is the newest that is not
      # one, so a patch to an older line never takes it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          newest="$(git tag -l 'v*' | grep -v -- - | sort -V | tail -n 1)"
          prerelease=false latest=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          elif [[ "$TAG" == "$newest" ]]; then
            latest=true
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest" \
            --repo "$GITHUB_REPOSITORY"

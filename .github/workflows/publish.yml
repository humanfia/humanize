# Releases, through release-please: every push to `main`, or to a `release/*` maintenance
# branch, keeps one release pull request open against it, which bumps `version` in
# pyproject.toml and uv.lock and writes CHANGELOG.md from the Conventional Commits since the
# last release. Merging it tags the release and publishes it. Nobody tags, writes a changelog or
# runs a workflow by hand. docs/contributing/releasing.md has the rest.
#
# PyPI trusts this file by its name and the `pypi` environment, through trusted publishing:
# no token is stored anywhere, so renaming this file or the environment stops releases until
# the publisher on PyPI is changed to match.

name: publish

on:
  push:
    branches: [main, "release/**"]

permissions: {}

# One run at a time a branch, and never one cancelled half-way through an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # A fork has no release pull request.
    if: github.repository == 'humanfia/humanize'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release pull request's branch, the tag and the draft release
      pull-requests: write # the release pull request
      issues: write # the `autorelease:` labels it finds its pull requests by
      actions: write # to run ci.yml on the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: ${{ github.ref_name }}

      # A pull request this workflow's token opens or updates starts no `ci-ok` of its own, and
      # the branch rule needs one. A dispatch is the one event that token may start.
      - name: Run CI on the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Nothing restored from a cache another run wrote goes into what is published.
          enable-cache: false

      - name: Build the wheel and the sdist
        run: uv build --no-sources

      - name: PyPI will render the description
        run: uvx twine@7.0.0 check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/hmz
    permissions:
      id-token: write # traded with PyPI for an upload token, and what the attestations are signed by
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  release:
    name: publish the release
    # After PyPI, so the release never offers files PyPI refused.
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to attach the files and take the release out of draft
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # A patch to an older version, from a `release/*` branch, is never the latest release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          LATEST: ${{ github.ref_name == 'main' }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest="$LATEST" --repo "$GITHUB_REPOSITORY"

# Opens a release: run by hand with the version to release, it opens a pull request that sets
# that version in pyproject.toml and uv.lock, with the release notes in its description.
# Merging the pull request is what releases it, through publish.yml.
# docs/contributing/releasing.md is how a maintainer gets there.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, in SemVer without the v: 0.2.0, or 0.2.0-rc.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  open:
    name: open the release pull request
    if: github.repository == 'humanfia/humanize' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release branch
      pull-requests: write # the release pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are every commit since the previous release's tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # SemVer for the tag, and PEP 440 for the package: 0.2.0-rc.1 is 0.2.0rc1 on PyPI.
      - name: Check the version
        id: version
        env:
          SEMVER: ${{ inputs.version }}
        run: |
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$SEMVER" =~ $pattern ]]; then
            echo "::error::'$SEMVER' is not X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$SEMVER" >/dev/null; then
            echo "::error::v$SEMVER is released already"
            exit 1
          fi
          pep440="$(sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/' <<<"$SEMVER")"
          current="$(uv version --short)"
          if ! uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; sys.exit(Version(sys.argv[1]) <= Version(sys.argv[2]))' \
            "$pep440" "$current"; then
            echo "::error::$SEMVER does not come after $current"
            exit 1
          fi
          echo "pep440=$pep440" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          git log --no-merges --format='- %s (%h)' ${previous:+"$previous..HEAD"} \
            | grep -v '^- chore(release): ' > "$RUNNER_TEMP/notes.md" || true

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SEMVER: ${{ inputs.version }}
          PEP440: ${{ steps.version.outputs.pep440 }}
        run: |
          branch="release/v$SEMVER"
          uv version "$PEP440"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): v$SEMVER"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          # A pull request's description holds 65536 characters, and a first release's notes
          # are the whole history: the release itself carries all of them.
          lines="$(wc -l < "$RUNNER_TEMP/notes.md")"
          {
            echo "Merging this releases \`v$SEMVER\` to PyPI and GitHub, with these notes:"
            echo
            head -n 300 "$RUNNER_TEMP/notes.md"
            if (( lines > 300 )); then
              echo "- …and $((lines - 300)) more"
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "chore(release): v$SEMVER" \
            --body-file "$RUNNER_TEMP/body.md"

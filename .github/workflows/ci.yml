# Lint and the package, then the tests on Linux and macOS: on each system one job runs the unit
# tests a package at a time and the integration tests a topic at a time; the macOS app in
# desktop/ is built and tested on macOS. Each runs
# only for what the change touched: a package's unit tests when the package or its tests
# changed, a topic when a package it runs or its tests changed, everything when what all the
# tests share changed. Few jobs, because the organisation runs at most 20 at once and 5 of them on macOS,
# and a job's setup outlasts most packages' tests. `ci-ok` is the one check a branch rule
# needs, and the merge queue runs it again on each pull request as `main` will be once it
# merges, so a push to `main`, already tested there, runs none of this: cache.yml saves the
# caches these restore. A push to a `release/*` branch runs it, on what the push changed.
# title.yml checks the pull request's title. `tests/system` runs real agents, and the web page
# in real browsers, and is never run here. docs/contributing/ci.md has the rest.

name: ci

on:
  pull_request:
  # The merge queue: `main`, with the pull requests ahead of this one merged, and this one.
  merge_group:
  # What a release is built from: the release pull request merged, or a commit pushed there.
  push:
    branches: ["release/**"]
  # release.yml runs it on the release pull request, which its token cannot start otherwise.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit to a release branch keeps its run, so a failure there is pinned to one commit.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FORCE_COLOR: "1"

jobs:
  # What the change touched, from a Linux runner, so what it leaves alone spends no runner.
  # `changes` lists the filters below it matched. release.yml's dispatch skips it, and runs
  # everything.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A pull request against its base, the merge queue against `main`, and a push against
          # the branch before it; a release branch's first push, against nothing, runs everything.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          # Unit tests mock every other package, so a package's run only for it. The agents,
          # daemon and tui topics run the packages they import, and `hmz`, which loads the
          # rest lazily; core, anchor and web run `hmz` whole. runtime, flows and coganchor
          # import each other, so each is the three.
          filters: |
            shared: &shared
              - pyproject.toml
              - uv.lock
              - src/hmz/*
              - tests/conftest.py
              - .github/workflows/ci.yml
            kernel: &kernel
              - src/hmz/runtime/**
              - src/hmz/flows/**
              - src/hmz/coganchor/**
            unit-cli: [*shared, src/hmz/cli/**, tests/unit/cli/**]
            unit-coganchor: [*shared, src/hmz/coganchor/**, tests/unit/coganchor/**]
            unit-daemon: [*shared, src/hmz/daemon/**, tests/unit/daemon/**]
            unit-flows: [*shared, src/hmz/flows/**, tests/unit/flows/**]
            unit-runtime: [*shared, src/hmz/runtime/**, tests/unit/runtime/**]
            unit-sdk: [*shared, src/hmz/sdk/**, tests/unit/sdk/**]
            unit-tui: [*shared, src/hmz/tui/**, tests/unit/tui/**]
            unit-web: [*shared, src/hmz/web/**, tests/unit/web/**]
            integration-agents:
              - *shared
              - *kernel
              - src/hmz/cli/**
              - tests/integration/*_agents*.py
            integration-daemon:
              - *shared
              - *kernel
              - src/hmz/{cli,daemon,sdk}/**
              - tests/integration/*_daemon*.py
            integration-tui:
              - *shared
              - *kernel
              - src/hmz/{cli,daemon,tui}/**
              - tests/integration/*_tui*.py
            integration-core:
              - *shared
              - src/hmz/**
              - tests/integration/*_core*.py
            integration-anchor:
              - *shared
              - src/hmz/**
              - tests/integration/*_anchor*.py
              - tests/integration/doubles_core.py
            integration-web:
              - *shared
              - src/hmz/**
              - tests/integration/*_web*.py
              - tests/integration/doubles_core.py
            desktop:
              - desktop/**
              - .github/workflows/ci.yml

  # Every pre-commit hook: ruff, pyright, actionlint, zizmor and the file hygiene. Then what a
  # release would build, so any commit on a `release/*` branch can be released.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        env:
          # zizmor asks GitHub whether each pinned commit is the tag it says.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --all-extras pre-commit run --all-files --show-diff-on-failure

      - name: Build the wheel and the sdist
        if: ${{ !cancelled() }}
        run: uv build --no-sources --out-dir dist

      - name: PyPI will render the description
        if: ${{ !cancelled() }}
        run: uvx twine@7.0.0 check --strict dist/*

  # Each package's unit tests and each topic's integration tests run alone, as they would in a
  # job of their own, so none leans on another's; the log folds each into a group.
  tests:
    name: tests (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"unit-') || contains(needs.changes.outputs.changes, '"integration-')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-cache: false

      - name: uv sync
        run: uv sync --frozen --all-extras

      - name: pytest tests/unit/<package>, a package at a time
        env:
          CHANGES: ${{ needs.changes.outputs.changes || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          status=0
          for dir in tests/unit/*/; do
            package=$(basename "$dir")
            if ! grep -q "^ *unit-$package:" .github/workflows/ci.yml; then
              status=1; echo "::error::tests/unit/$package has no unit-$package filter in ci.yml"
            fi
            if [[ $EVENT != workflow_dispatch && $CHANGES != *"\"unit-$package\""* ]]; then
              echo "unit $package: unchanged"
              continue
            fi
            echo "::group::unit $package"
            uv run --frozen --all-extras pytest "$dir" --durations=10 \
              || { status=1; echo "::error::tests/unit/$package failed"; }
            echo "::endgroup::"
          done
          exit "$status"

      # Two workers a vCPU: these tests wait on subprocesses, sockets and pseudoterminals far
      # more than they compute, and `-n auto` alone counts physical cores.
      - name: pytest tests/integration/test_<topic>_*.py, a topic at a time
        if: ${{ !cancelled() }}
        env:
          CHANGES: ${{ needs.changes.outputs.changes || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          export PYTEST_XDIST_AUTO_NUM_WORKERS=$((2 * $(getconf _NPROCESSORS_ONLN)))
          status=0
          for topic in core agents tui daemon anchor web; do
            if [[ $EVENT != workflow_dispatch && $CHANGES != *"\"integration-$topic\""* ]]; then
              echo "integration $topic: unchanged"
              continue
            fi
            echo "::group::integration $topic"
            uv run --frozen --all-extras pytest tests/integration/test_"$topic"_*.py --durations=25 \
              || { status=1; echo "::error::integration $topic failed"; }
            echo "::endgroup::"
          done
          exit "$status"

  # The macOS app in desktop/: its Rust held to rustfmt and clippy, its tests, and the app built
  # as a release builds it, but unoptimised and without the disk image.
  desktop:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"desktop"')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-if: false

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm tauri build --debug --bundles app

  ci-ok:
    if: always()
    needs: [changes, static, tests, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # `changes` on a dispatch, and what the change left alone.
          allowed-skips: changes, tests, desktop
          jobs: ${{ toJSON(needs) }}

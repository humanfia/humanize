# Every change is checked, and how much of it runs grows with how close the change is to
# `main`: `plan` says which tier this run is, `changes` what the change touched, and each stage
# waits on the one before it, so a change that fails to lint never takes a runner for its
# tests and one that touched no Python takes none for them at all. `ci-ok` at the end is the
# one check a branch rule needs. docs/contributing/ci.md has the tiers and the graph.

name: ci

on:
  push:
    # The merge queue pushes a branch of its own for every group, and `merge_group` below is
    # already the run for it.
    branches: ["**", "!gh-readonly-queue/**"]
  pull_request:
  merge_group:
  schedule:
    # Nightly, for what changes under a commit that did not: a dependency's new release, a
    # runner's new image.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A newer commit makes an older run on the same branch or pull request moot. Every commit to
  # `main` keeps its own, since that is where a failure has to be pinned to one commit.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - name: Which tier this run is
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.base_ref }}
        run: |
          os='["ubuntu-latest"]'
          python='["3.12"]'
          if [[ "$EVENT" =~ ^(merge_group|schedule|workflow_dispatch)$ ]] ||
            [[ "$EVENT" == push && "$REF" == refs/heads/main ]] ||
            [[ "$EVENT" == pull_request && "$BASE" == main ]]; then
            tier="full"
            # Every Python the package claims, on both systems it runs on.
            os='["ubuntu-latest", "macos-latest"]'
            python='["3.12", "3.13", "3.14"]'
          elif [[ "$EVENT" == pull_request ]]; then
            tier="pr"
          else
            tier="push"
          fi
          {
            echo "tier=$tier"
            echo "os=$os"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"
          echo "Tier: **$tier** ($EVENT on $REF${BASE:+ into $BASE})" >> "$GITHUB_STEP_SUMMARY"

  changes:
    name: changes
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A run with nothing to compare against -- nightly, or by hand -- checks everything.
      python: ${{ steps.filter.outputs.python || 'true' }}
      package: ${{ steps.filter.outputs.package || 'true' }}
      docs: ${{ steps.filter.outputs.docs || 'true' }}
      workflows: ${{ steps.filter.outputs.workflows || 'true' }}
    steps:
      # A pull request's files are listed by the API; everything else is compared with git.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The workflow and the action that set Python up are in each list they run, so a
          # change to how something is checked is checked by it.
          filters: |
            python:
              - src/**
              - tests/**
              - pyproject.toml
              - uv.lock
              - .python-version
              - .github/actions/setup-uv/**
              - .github/workflows/ci.yml
            package:
              - src/**
              - pyproject.toml
              - uv.lock
              - README.md
              - LICENSE
              - .github/actions/setup-uv/**
              - .github/workflows/ci.yml
            docs:
              - docs/**
              - .github/workflows/build-docs.yml
              - .github/workflows/ci.yml
            workflows:
              - .github/**
              - .pre-commit-config.yaml

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every hook but the type checker, which is the next stage, and the two that read the
      # workflows, which are `workflows` below.
      - name: pre-commit
        env:
          SKIP: pyright,actionlint,zizmor
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  workflows:
    name: workflows
    needs: [plan, changes]
    if: needs.plan.outputs.tier != 'push' && needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-workflows-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: actionlint
        run: uv run --frozen pre-commit run actionlint --all-files

      - name: zizmor
        env:
          # Online, which a commit hook is not: whether a pinned commit is really the tag it
          # says, and whether an action is one with an advisory against it.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen pre-commit run zizmor --all-files

  typecheck:
    name: typecheck
    needs: [plan, changes, lint, workflows]
    if: >-
      !cancelled()
      && needs.lint.result == 'success'
      && needs.workflows.result != 'failure'
      && needs.plan.outputs.tier != 'push'
      && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - name: pyright (strict)
        run: uv run --frozen pyright

  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.python }})
    needs: [plan, changes, lint, workflows, typecheck]
    # A stage that this tier leaves out is skipped rather than failed, and is no reason to stop.
    if: >-
      !cancelled()
      && needs.lint.result == 'success'
      && needs.workflows.result != 'failure'
      && needs.typecheck.result != 'failure'
      && needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        python: ${{ fromJSON(needs.plan.outputs.python) }}
    env:
      COVERAGE_FILE: .coverage.unit-${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python }}

      # `tests/test_tiers.py` beside each tier checks that tier's tree.
      - name: pytest tests/unit
        run: >
          uv run --frozen pytest tests/unit tests/test_tiers.py --durations=10
          --timeout-method=thread --cov=hmz --cov-report=

      - if: needs.plan.outputs.tier == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.python }})
    needs: [plan, unit]
    if: >-
      !cancelled()
      && needs.unit.result == 'success'
      && needs.plan.outputs.tier != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        python: ${{ fromJSON(needs.plan.outputs.python) }}
    env:
      COVERAGE_FILE: .coverage.integration-${{ matrix.os }}-${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python }}

      - name: pytest tests/integration
        run: >
          uv run --frozen pytest tests/integration tests/test_tiers.py --durations=25
          --timeout-method=thread --cov=hmz --cov-report=

      - if: needs.plan.outputs.tier == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  system:
    name: system (ubuntu-latest, 3.12)
    needs: [plan, integration]
    if: >-
      !cancelled()
      && needs.integration.result == 'success'
      && needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COVERAGE_FILE: .coverage.system-ubuntu-latest-3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      # What a developer's machine has and a runner does not until asked: the images the
      # container tests start, a swarm this machine manages, and `ssh localhost` without a
      # password. No coding agent is installed and nothing is signed in, so every test that
      # would spend tokens skips, as it does without `--run-agents` anywhere.
      - name: Docker images, a swarm, and ssh to this machine
        run: |
          docker pull --quiet python:3.12-slim
          docker pull --quiet python:3.12
          docker pull --quiet docker:dind
          docker swarm init
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes localhost true

      - name: pytest tests/system
        run: >
          uv run --frozen pytest tests/system tests/test_tiers.py --durations=25
          --timeout-method=thread --cov=hmz --cov-report=

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-system-ubuntu-latest-3.12
          path: ${{ env.COVERAGE_FILE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage
    needs: [plan, unit, integration, system]
    if: >-
      !cancelled()
      && needs.unit.result == 'success'
      && needs.integration.result == 'success'
      && needs.system.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The report reads the source each line was counted in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          sync: --only-dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Every tier on every runner, combined
        run: |
          uv run --frozen --no-sync coverage combine coverage
          uv run --frozen --no-sync coverage xml
          uv run --frozen --no-sync coverage report --sort=cover
          {
            echo "## Coverage: $(uv run --frozen --no-sync coverage report --format=total)%"
            echo
            echo "Every tier, on every runner, combined."
            echo
            echo "<details><summary>By file</summary>"
            echo
            uv run --frozen --no-sync coverage report --format=markdown --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: build
    needs: [plan, changes, lint]
    if: needs.plan.outputs.tier == 'full' && needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          sync: none

      - run: uv build

      # What PyPI would refuse, or render badly from the README, refused here instead.
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.python }})
    needs: [plan, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        python: ${{ fromJSON(needs.plan.outputs.python) }}
    steps:
      # No checkout: what is checked is the wheel, and a source tree beside it could stand in
      # for something the wheel left out.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}

      # The wheel alone, with none of its extras: the drivers that want one load it where a
      # turn needs it, so neither is imported as `hmz` starts or as their classes are named.
      - name: humanize starts with none of its extras
        run: |
          uv venv smoke
          uv pip install --python smoke dist/*.whl
          smoke/bin/python -c "
          import hmz.cli, hmz.tui.app
          from hmz.coganchor.agents import DshAgent, KimiCodeCLIAgent
          print(DshAgent.__name__, KimiCodeCLIAgent.__name__)
          "

  docs:
    name: docs
    needs: [plan, changes]
    if: needs.plan.outputs.tier == 'full' && needs.changes.outputs.docs == 'true'
    # The build is read-only. The other two are for the deploy that follows a push to `main`,
    # which a called workflow can only be handed, never take for itself.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-docs.yml

  dependency-review:
    name: dependency-review
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - plan
      - changes
      - lint
      - workflows
      - typecheck
      - unit
      - integration
      - system
      - coverage
      - build
      - smoke
      - docs
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Green when everything that ran passed, and a job a tier leaves out is not a failure.
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            workflows, typecheck, unit, integration, system, coverage, build, smoke, docs,
            dependency-review
          jobs: ${{ toJSON(needs) }}

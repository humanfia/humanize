# Lint, then the unit tests one job per package and the integration tests one job per topic,
# on Linux and macOS. `ci-ok` is the one check a branch rule needs. `tests/system` runs real
# agents and is never run here. docs/contributing/ci.md has the rest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit to `main` keeps its run, so a failure there is pinned to one commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: "1"

jobs:
  # Every pre-commit hook: ruff, pyright, actionlint, zizmor and the file hygiene.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        env:
          # zizmor asks GitHub whether each pinned commit is the tag it says.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        package: [cli, coganchor, daemon, flows, runtime, sdk, tui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - name: pytest tests/unit/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # TRANSITION: a package with no tests yet passes. Removed before this lands on main.
          [ -d "tests/unit/$PACKAGE" ] || exit 0
          uv run --frozen pytest "tests/unit/$PACKAGE" --durations=10

  integration:
    name: integration (${{ matrix.os }}, ${{ matrix.topic }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        topic: [core, agents, tui, daemon, anchor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      # Two workers a vCPU: these tests wait on subprocesses, sockets and pseudoterminals far
      # more than they compute, and `-n auto` alone counts physical cores.
      - name: pytest tests/integration/test_${{ matrix.topic }}_*.py
        env:
          TOPIC: ${{ matrix.topic }}
        run: |
          shopt -s nullglob
          files=(tests/integration/test_"$TOPIC"_*.py)
          # TRANSITION: a topic with no tests yet passes. Removed before this lands on main.
          [ "${#files[@]}" -gt 0 ] || exit 0
          PYTEST_XDIST_AUTO_NUM_WORKERS=$((2 * $(getconf _NPROCESSORS_ONLN))) \
            uv run --frozen pytest "${files[@]}" --durations=25

  ci-ok:
    if: always()
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

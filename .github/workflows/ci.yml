# The second gate. The first is `.pre-commit-config.yaml`; this runs the same hooks over
# every file rather than the ones one commit touched, and it runs two of the three test
# tiers, on every Python the package claims. Linux only: see the matrix below for why the
# second system was taken out.
#
# The two it runs are `tests/unit/` and `tests/integration/`: everything whose every
# counterpart is something this repository wrote. A stand-in CLI on `PATH`, a fake app
# server, a loopback socket, the mock LLM service. Those need a checkout and nothing else,
# which is what makes them a gate rather than a weather report.
#
# `tests/system/` is the third, and CI never runs it. It drives a real coding-agent CLI as
# the account that machine is already signed into -- `as local`, the provider that is no
# provider -- and with it real ptrace, real seccomp, real docker, real ssh, a real daemon
# fork. None of that is here, and a hosted runner's absence of it is not news about a
# change. That tier is run by the person who touched what it covers, on the machine that
# has the thing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: The lockfile says what pyproject.toml says
        run: uv lock --check

      - run: uv sync --frozen

      # Everything a commit is held to, over the whole tree rather than over the files
      # one commit happened to touch.
      - name: pre-commit
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: The package still builds
        run: uv build

      # An extra nobody installs is an extra nobody finds out is broken. This is the other
      # install: no extras and no development group, which is what somebody who ran the line
      # in the README has. Every backend but the two behind extras must still be there, the
      # interface must still start, and the two must still be importable -- they say what is
      # missing where a turn needs it rather than where a module is read.
      - name: humanize starts with none of its extras
        run: |
          uv sync --frozen --no-default-groups
          uv run --frozen --no-sync python -c "
          import hmz.cli, hmz.tui.app
          from hmz.coganchor.agents import DshAgent, KimiCodeCLIAgent
          print(DshAgent.__name__, KimiCodeCLIAgent.__name__)
          "

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A cell finishes in about a quarter of an hour. Twice that, because a job killed at
    # the wall reports nothing at all about what it was doing -- which is the one outcome
    # worth spending minutes to avoid, and the one this matrix spent a morning learning.
    # What bounds a single test is `timeout` in pyproject.toml, not this.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every stable minor at or above the floor `requires-python` sets. A new one
        # ships, a new one goes here -- that is what the README promises.
        python: ["3.12", "3.13", "3.14"]
        # Linux, and for now only Linux. The half of this that runs an agent under an
        # anchor is a seccomp filter and a ptrace supervisor, which is Linux on x86-64 and
        # says so by skipping everywhere else -- so Linux is where the whole of the suite
        # actually runs, and the system this is built to be trusted on.
        #
        # macOS was the second cell and has been taken out. It cost three jobs a run to
        # tell us mostly what Linux had already told us, and the part that was its own was
        # unreliable rather than informative: the process sampler wedges an interpreter
        # there -- known and skipped outright on Python 3.13, and seen hanging 3.12 and
        # 3.14 about one run in three, which is a red build about the runner rather than
        # about the change. A dimension rather than a bare `runs-on`, so putting it back
        # is one word here once that is worth paying for again.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # Every extra, and still every extra now that CI runs two tiers rather than all of
      # them. `[kimi]` is `websockets`, which the development group already brings for the
      # suite's own websocket server, so that one is free. `[dsh]` is not, and which test
      # needs it is no longer the one this comment used to name. The test that starts
      # DeepSeek's own runtime for real, to read back what it answers a turn with no
      # credential, is `tests/system/tui/test_app.py` -- the third tier, which the `--ignore`
      # below means this job never reaches, and whose `skipif` on `find_spec` is left there
      # for the developer who runs that tier without the extra.
      #
      # What this job runs is `tests/unit/agents/test_dsh.py`, the same backend against a
      # fake harness, and the fake does not cover this: its autouse fixture stands in for the
      # harness type and the runtime executable, but the forty-two tests about what the
      # runtime composition comes to read the bundled `runtime/cordis.yml` off
      # `deepseek_harness_runtime` through `_sdk_composition`, on purpose -- the point of
      # those tests is that an install with nothing set gets the harness's own default rather
      # than a copy somebody has to keep in step, and a faked copy would be exactly the thing
      # they exist to refuse. So for the two tiers CI does run, the extra left out is not a
      # backend going quietly uncovered with a line in the `-ra` summary; it is forty-two red
      # tests about a dependency rather than about the change. Installing every extra is what
      # keeps either from ever being the reason.
      - run: uv sync --frozen --all-extras

      # The unit and integration tiers, in one job rather than two. Splitting them would
      # double the cells for nothing, and would make one coverage file out of two runs that
      # share no disk -- `--cov-append` cannot reach across jobs, so it would be an artifact
      # merge -- to answer a question nobody asked CI. The tiers
      # are how a person gets a fast loop on their own machine (`uv run pytest tests/unit`
      # while still writing it); what CI is asked is whether the whole thing passes, and
      # that is one answer, so it is one job.
      #
      # `--ignore` rather than `-m "not system"`, and the difference is not cosmetic.
      # Deselecting still collects, and collecting is importing. The system tier is where a
      # module that imports what only a developer's machine has would live, and a collection
      # error there is a red job about a tier this job was never going to run -- which says
      # nothing at all about the change that triggered it.
      #
      # Not, note, to save the import-time machine probes: this job pays for those either
      # way. `tests/integration/coganchor/conftest.py` reaches `tests/coganchor/conftest.py`,
      # which reads `WITHOUT` out of `tests/supervising.py`, which spawns a supervisor at
      # module scope to work out whether anything here can be traced -- once per xdist
      # worker, on every run. Ignoring a directory the import does not go through saves
      # none of that, and the argument above does not need it to.
      #
      # What `-ra` buys -- a test that quietly stops running says so -- is bought where it
      # is worth buying, on the run a contributor does before pushing: there the tier is
      # collected and skips aloud with its reason. Here the exclusion is one directory,
      # written in the file somebody opens to find out what CI does.
      #
      # It is not the only thing holding real agents out, and must not be the only thing
      # relied on. `tests/conftest.py` skips every `agent`-marked test unless `--run-agents`
      # is passed, which this job never passes; that is what covers an agent test wherever
      # it sits, including one that has not reached `tests/system/` yet.
      #
      # `--durations` because a suite that spawns a CLI per test is not evenly expensive,
      # and a runner is not the machine anybody wrote the test on: a list of the slowest
      # twenty-five is how the one that quietly grew a minute stays visible.
      - name: pytest
        run: >
          uv run --frozen pytest -q --durations=25 --timeout-method=thread
          --ignore=tests/system
          --cov=hmz --cov-report=term-missing --cov-report=xml

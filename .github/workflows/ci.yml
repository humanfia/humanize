# Lint and the package, then the tests on Linux and macOS: on each system one job runs the unit
# tests a package at a time and the integration tests a topic at a time; the app in desktop/
# is built and tested on macOS, and on Windows. Each runs
# only for what the change touched: a package's unit tests when the package or its tests
# changed, a topic when a package it runs or its tests changed, everything when what all the
# tests share changed. Few jobs, because the organisation runs at most 20 at once and 5 of them on macOS,
# and a job's setup outlasts most packages' tests. `ci-ok` is the one check a branch rule
# needs, and the merge queue runs it again on each pull request as `main` will be once it
# merges, so a push to `main`, already tested there, runs none of this: cache.yml saves the
# caches these restore. A push to a `release/*` branch runs it, on what the push changed.
# title.yml checks the pull request's title. `tests/system` runs real agents, and the web page
# in real browsers, and is never run here. CONTRIBUTING.md has the rest.

name: ci

on:
  pull_request:
  # The merge queue: `main`, with the pull requests ahead of this one merged, and this one.
  merge_group:
  # What a release is built from: the release pull request merged, or a commit pushed there.
  push:
    branches: ["release/**"]
  # release.yml runs it on the release pull request, which its token cannot start otherwise.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit to a release branch keeps its run, so a failure there is pinned to one commit.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FORCE_COLOR: "1"

jobs:
  # What the change touched, from a Linux runner, so what it leaves alone spends no runner.
  # `changes` lists the filters below it matched. release.yml's dispatch skips it, and runs
  # everything.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A pull request against its base, the merge queue against `main`, and a push against
          # the branch before it; a release branch's first push, against nothing, runs everything.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          # Unit tests mock every other package, so a package's run only for it. The agents,
          # daemon and tui topics run the packages they import, and `hmz`, which loads the
          # rest lazily; core, anchor and web run `hmz` whole. runtime, flows and coganchor
          # import each other, so each is the three. A double counts for every topic whose
          # tests import it, and a document of protocol/ for every suite whose tests read it,
          # which tests/integration/test_core_ci_filters.py holds these to.
          filters: |
            shared: &shared
              - pyproject.toml
              - uv.lock
              - src/hmz/*
              # What the command line and the terminal interface say, and their tests read.
              - src/hmz/words/**
              - tests/conftest.py
              - tests/integration/conftest.py
              - tests/integration/flows/**
              - .github/workflows/ci.yml
            kernel: &kernel
              - src/hmz/runtime/**
              - src/hmz/flows/**
              - src/hmz/coganchor/**
            # tests/unit/conftest.py is under every unit test, and under no other.
            unit: &unit
              - *shared
              - tests/unit/conftest.py
            unit-cli: [*unit, src/hmz/cli/**, tests/unit/cli/**]
            unit-coganchor: [*unit, src/hmz/coganchor/**, tests/unit/coganchor/**]
            # The daemon's tests hold what it serves to the methods of protocol/openrpc.json.
            unit-daemon: [*unit, src/hmz/daemon/**, tests/unit/daemon/**, protocol/openrpc.json]
            unit-flows: [*unit, src/hmz/flows/**, tests/unit/flows/**]
            unit-runtime: [*unit, src/hmz/runtime/**, tests/unit/runtime/**]
            unit-sdk: [*unit, src/hmz/sdk/**, tests/unit/sdk/**]
            unit-tui: [*unit, src/hmz/tui/**, tests/unit/tui/**]
            unit-web: [*unit, src/hmz/web/**, tests/unit/web/**]
            unit-words: [*unit, tests/unit/words/**]
            # The RPC package holds protocol/openrpc.json to the protocol's text.
            unit-rpc: [*unit, src/hmz/rpc/**, tests/unit/rpc/**, protocol/**]
            unit-trust: [*unit, src/hmz/trust/**, tests/unit/trust/**]
            unit-reach: [*unit, src/hmz/reach/**, tests/unit/reach/**]
            unit-relay: [*unit, src/hmz/relay/**, tests/unit/relay/**]
            unit-rtc: [*unit, src/hmz/rtc/**, tests/unit/rtc/**]
            integration-agents:
              - *shared
              - *kernel
              - src/hmz/cli/**
              - tests/integration/*_agents*.py
            integration-daemon:
              - *shared
              - *kernel
              - src/hmz/{cli,daemon,reach,relay,rpc,sdk,trust,web}/**
              - tests/integration/*_daemon*.py
              - tests/integration/doubles_core.py
              - tests/integration/doubles_easytier.py
              - tests/integration/doubles_ssh.py
            integration-tui:
              - *shared
              - *kernel
              - src/hmz/{cli,daemon,reach,rpc,trust,tui}/**
              - tests/integration/*_tui*.py
              - tests/integration/doubles_daemon.py
              - tests/integration/doubles_ssh.py
            integration-core:
              - *shared
              - src/hmz/**
              - tests/integration/*_core*.py
              - tests/integration/doubles_daemon.py
              # tests/integration/test_core_cli_help.py holds the methods a command names to
              # the protocol's, test_core_cli_reference.py the reference to what the script
              # writes from the commands, and test_core_coverage.py every command to its
              # section of protocol/cli.md.
              - protocol/openrpc.json
              - protocol/cli.md
              - scripts/cli_reference.py
              - docs/reference/cli.md
              # tests/integration/test_core_ci_caches.py holds it to what the jobs here restore.
              - .github/workflows/cache.yml
            integration-anchor:
              - *shared
              - src/hmz/**
              - crates/coganchor/**
              - tests/integration/*_anchor*.py
              - tests/integration/doubles_core.py
              - tests/integration/doubles_easytier.py
            integration-web:
              - *shared
              - src/hmz/**
              - tests/integration/*_web*.py
              # The policy a page is served with is read out of it.
              - protocol/web.md
              - tests/integration/doubles_core.py
              - tests/integration/doubles_daemon.py
              - tests/integration/doubles_ssh.py
            # A daemon reached over each carrier: ssh and EasyTier through their doubles, and a
            # WebRTC data channel over loopback. reach dials EasyTier and ssh through coganchor.
            integration-reach:
              - *shared
              - *kernel
              - src/hmz/{cli,daemon,reach,rpc,rtc,trust}/**
              - tests/integration/*_reach*.py
              - tests/integration/doubles_ssh.py
              - tests/integration/doubles_easytier.py
            integration-relay:
              - *shared
              - src/hmz/{cli,reach,relay,rpc,rtc,trust}/**
              - tests/integration/*_relay*.py
              - tests/unit/relay/doubles_relay.py
            # The page's own modules, tested by node alone, its writes against the methods of
            # protocol/openrpc.json.
            js:
              - .github/workflows/ci.yml
              - src/hmz/web/static/**
              - tests/unit/web/js/**
              - protocol/openrpc.json
            # The page's third-party code, and what builds it.
            vendor:
              - src/hmz/web/vendor/**
              - src/hmz/web/static/vendor/**
              - .github/workflows/ci.yml
            coganchor:
              - crates/coganchor/**
              - release-please-config.json
              - .github/workflows/ci.yml
            # The app, and the page it carries.
            desktop:
              - desktop/**
              - src/hmz/web/static/**
              - .github/workflows/ci.yml

  # Every pre-commit hook: ruff, pyright, actionlint, zizmor and the file hygiene. Then what a
  # release would build, so any commit on a `release/*` branch can be released.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-cache: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        env:
          # zizmor asks GitHub whether each pinned commit is the tag it says.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --all-extras pre-commit run --all-files --show-diff-on-failure

      - name: Build the wheel and the sdist
        if: ${{ !cancelled() }}
        run: uv build --no-sources --out-dir dist

      - name: PyPI will render the description
        if: ${{ !cancelled() }}
        run: uvx twine@7.0.0 check --strict dist/*

  # Each package's unit tests and each topic's integration tests run alone, as they would in a
  # job of their own, so none leans on another's; the log folds each into a group.
  tests:
    name: tests (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"unit-') || contains(needs.changes.outputs.changes, '"integration-') || contains(needs.changes.outputs.changes, '"js"')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-cache: false

      - name: uv sync
        run: uv sync --frozen --all-extras

      # The anchor runs only as `coganchor`, which the tests find in crates/coganchor/target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/coganchor
          # The cache the `coganchor` job reads: a cache is keyed by its job's name, and
          # cache.yml saves none under this job's.
          shared-key: coganchor
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-if: false

      - name: cargo build crates/coganchor
        run: cargo build --locked --manifest-path crates/coganchor/Cargo.toml

      # The fence's second backend on Linux, for the tests that put a program inside it: bwrap,
      # and the namespaces an ordinary user may make, which Ubuntu's AppArmor holds back.
      - name: bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: pytest tests/unit/<package>, a package at a time
        env:
          CHANGES: ${{ needs.changes.outputs.changes || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          status=0
          for dir in tests/unit/*/; do
            package=$(basename "$dir")
            if ! grep -q "^ *unit-$package:" .github/workflows/ci.yml; then
              status=1; echo "::error::tests/unit/$package has no unit-$package filter in ci.yml"
            fi
            if [[ $EVENT != workflow_dispatch && $CHANGES != *"\"unit-$package\""* ]]; then
              echo "unit $package: unchanged"
              continue
            fi
            echo "::group::unit $package"
            uv run --frozen --all-extras pytest "$dir" --durations=10 \
              || { status=1; echo "::error::tests/unit/$package failed"; }
            echo "::endgroup::"
          done
          exit "$status"

      # Two workers a vCPU: these tests wait on subprocesses, sockets and pseudoterminals far
      # more than they compute, and `-n auto` alone counts physical cores.
      - name: pytest tests/integration/test_<topic>_*.py, a topic at a time
        if: ${{ !cancelled() }}
        env:
          CHANGES: ${{ needs.changes.outputs.changes || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          export PYTEST_XDIST_AUTO_NUM_WORKERS=$((2 * $(getconf _NPROCESSORS_ONLN)))
          status=0
          for topic in core agents tui daemon anchor web reach relay; do
            if [[ $EVENT != workflow_dispatch && $CHANGES != *"\"integration-$topic\""* ]]; then
              echo "integration $topic: unchanged"
              continue
            fi
            # A topic its first tests have not reached yet.
            if ! compgen -G "tests/integration/test_${topic}_*.py" > /dev/null; then
              echo "::notice::integration $topic has no tests yet"
              continue
            fi
            echo "::group::integration $topic"
            uv run --frozen --all-extras pytest tests/integration/test_"$topic"_*.py --durations=25 \
              || { status=1; echo "::error::integration $topic failed"; }
            echo "::endgroup::"
          done
          exit "$status"

      # The page's modules are plain ES modules with no build step, tested by node's own runner.
      # Named by a glob: node 24 loads a directory given alone as one module, not its tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"js"')) }}
        with:
          node-version: 24

      - name: node --test tests/unit/web/js
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"js"')) }}
        run: node --test 'tests/unit/web/js/*.test.mjs'

  # The page's third-party code in src/hmz/web/static/vendor, built again from the lockfile in
  # src/hmz/web/vendor: what is committed is what the pinned packages build, byte for byte.
  vendor:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"vendor"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/hmz/web/vendor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/hmz/web/vendor/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--intent-to-add` so that a bundle the build makes and nobody committed is a difference.
      - name: The bundles are what the lockfile builds
        run: |
          pnpm build
          git add --intent-to-add ../static/vendor
          git diff --exit-code --stat ../static/vendor \
            || { echo "::error::src/hmz/web/static/vendor is not what src/hmz/web/vendor builds: run pnpm install --frozen-lockfile && pnpm build there, and commit what it wrote."; exit 1; }

  # The anchor's own program in crates/coganchor: held to rustfmt and clippy, and tested, on
  # Linux, where its ptrace, seccomp and Landlock halves build, and on macOS, where the anchor
  # and the broker do. On Linux also built static, as the wheel carries it.
  coganchor:
    name: coganchor (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"coganchor"')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: crates/coganchor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/coganchor
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-if: false

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build, static
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/coganchor | grep -Eq 'static(ally|-pie) linked'

  # The kernel's Landlock ABI, not the runner image's, decides what a fence can hold. QEMU
  # runs software emulation: these jobs check syscalls and security policy, never speed.
  landlock:
    name: landlock (${{ matrix.kernel }}, ABI ${{ matrix.abi }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"coganchor"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "5.15"
            abi: 1
          - kernel: "6.8"
            abi: 4
          - kernel: "6.10"
            abi: 5
          - kernel: "6.12"
            abi: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/coganchor
          shared-key: coganchor
          save-if: false

      - name: Install QEMU, kernel build dependencies and BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential busybox-static cpio curl file flex jq libelf-dev \
            libssl-dev make musl-tools qemu-system-x86 xz-utils
          rustup target add x86_64-unknown-linux-musl

      - name: Landlock ABI ${{ matrix.abi }} on Linux ${{ matrix.kernel }}
        run: crates/coganchor/ci/landlock-kernel-matrix.sh ${{ matrix.kernel }} ${{ matrix.abi }}

  # The macOS app in desktop/: its Rust held to rustfmt and clippy, its tests, and the app built
  # and its disk image as a release builds them, but unoptimised.
  desktop:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"desktop"')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-if: false

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Install
        run: pnpm install --frozen-lockfile

      # Laid out by Finder, which the bundler skips where CI is set unless told not to: the
      # disk image without its .DS_Store is a bare folder, with no background and small icons.
      - name: Build the app and the disk image
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          pnpm tauri build --debug --bundles app,dmg
          named=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' src-tauri/target/debug/bundle/macos/*.app/Contents/Info.plist)
          test "$named" = Humanize || { echo "::error::The menu bar names the app $named, not Humanize."; exit 1; }
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" src-tauri/target/debug/bundle/dmg/*.dmg
          test -f "$RUNNER_TEMP/dmg/.DS_Store" || { echo "::error::The disk image was not laid out."; exit 1; }

  # The Windows app in desktop/, whose hmz runs in WSL: the same checks, and its installer as a
  # release builds it, but unoptimised.
  desktop-windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.changes.outputs.changes, '"desktop"')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          # Restores what cache.yml saved on `main`, and writes nothing.
          save-if: false

      - name: cargo fmt --check
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm tauri build --debug --bundles nsis

  ci-ok:
    if: always()
    needs: [changes, static, tests, vendor, coganchor, landlock, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # `changes` on a dispatch, and what the change left alone.
          allowed-skips: changes, tests, vendor, coganchor, landlock, desktop, desktop-windows
          jobs: ${{ toJSON(needs) }}

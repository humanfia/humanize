on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: The lockfile says what pyproject.toml says
        run: uv lock --check

      - run: uv sync --frozen

      - name: pre-commit
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: The package still builds
        run: uv build

      - name: humanize starts with none of its extras
        run: |
          uv sync --frozen --no-default-groups
          uv run --frozen --no-sync python -c "
          import hmz.cli, hmz.tui.app
          from hmz.coganchor.agents import DshAgent, KimiCodeCLIAgent
          print(DshAgent.__name__, KimiCodeCLIAgent.__name__)
          "

  test:
    name: test (${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: 3.12

      - run: uv sync --frozen --all-extras

      - name: pytest
        run: >
          uv run --frozen pytest -q --durations=25 --timeout-method=thread
          --ignore=tests/system
          --cov=hmz --cov-report=term-missing --cov-report=xml

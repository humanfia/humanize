# OpenSSF Scorecard: how this repository measures against the supply-chain checks other
# projects are judged by -- pinned actions, token permissions, branch protection, a security
# policy and the rest. Published, so the score is public and a badge can show it, and uploaded
# to the Security tab. Its API refuses results from a workflow with top-level `env` or
# `defaults`, write permissions above the job, or a step outside the few actions below, so
# keep it to them.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # The Security tab.
      security-events: write
      # What proves to the Scorecard API that these results came from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

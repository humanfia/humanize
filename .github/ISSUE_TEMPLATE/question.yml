name: Question
description: Ask how to do something the docs did not answer.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://docs.humanfia.ai/humanize/) and
        [Troubleshooting](https://docs.humanfia.ai/humanize/user/troubleshooting) answer most
        questions faster than a person can. If you looked there and it was not, ask away: the
        answer may become a page.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The commands you ran and the pages you read.
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        What `hmz --version` prints, and when you installed or last upgraded it: nothing is
        released yet, so every install is of `main` from git, which keeps one version number.
      placeholder: hmz 0.1.0

name: Bug Report
description: Something in humanize does not work.
title: "[Bug]: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Search the
        [existing issues](https://github.com/humanfia/humanize/issues?q=is%3Aissue) first, in
        case it is already known.

        **A vulnerability does not go here.** Report it privately, as
        [SECURITY.md](https://github.com/humanfia/humanize/blob/main/SECURITY.md) says.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to make it happen
      description: The command you ran or what you did in `hmz`, step by step.
      placeholder: |
        1. hmz exec -f chat -a assistant=claude/claude-opus-5:high "…"
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        What `hmz --version` prints, and when you installed or last upgraded it: nothing is
        released yet, so every install is of `main` from git, which keeps one version number.
      placeholder: hmz 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What operating systems are you seeing the problem on?
      multiple: true
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: backends
    attributes:
      label: What backends are you seeing the problem on?
      description: The coding agent CLIs the flow's agents ran on, if any.
      multiple: true
      options:
        - claude
        - codex
        - agy
        - dsh
        - grok
        - kimi
        - pi
        - qwen
        - opencode
        - mimo
        - cursor-agent
        - mcode
        - an ACP CLI
        - Other
  - type: input
    id: flow
    attributes:
      label: Flow
      description: The flow that was running, if any.
      placeholder: chat
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any relevant output. It is formatted as code, so no backticks are needed. Remove
        API keys, tokens and anything else private first.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

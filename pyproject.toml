[project]
name = "hmz"
version = "0.0.0"
description = "The agent flow system for token maxxing."
readme = "README.md"
authors = [
    { name = "Zijian Zhang", email = "35801754+futrime@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "ai", "claude-code", "codex", "coding-agents", "llm", "tui", "workflow"]
# No `License ::` classifier: PEP 639 retires them for `license` above, which is the one PyPI
# shows, and a backend is allowed to refuse a project that says both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "dateparser>=1.4.3",
    # The settings a CLI reads out of a project are JSON with comments and trailing commas,
    # as the CLIs read them, and what a hook there says is read before a session elsewhere.
    "json5>=0.12",
    # Which release of humanize is newer than the one running, and which extras an install
    # took, are PEP 440's and PEP 508's rules: `hmz update` reads both.
    "packaging>=26.2",
    "psutil>=7.2.2",
    # A flow says what it can be configured with by declaring a model, and the menu that
    # asks is read off that model: the types, the bounds and the combinations a flow
    # refuses are all written once, where the flow declares them.
    "pydantic>=2.13.5",
    "pyfiglet>=1.0",
    "pyinstrument>=5.1.3",
    "pyyaml>=6.0.3",
    # Named because the interface imports it directly. It arrives with textual either
    # way, but a dependency you import is one you declare.
    "rich>=15",
    # What a flowverse's index says of a flow's versions is SemVer: which is newer, and which
    # of them a dependency's range takes, are the package's rules rather than ours.
    "semver>=3.0.4",
    # What a crash is reported through, for as long as humanize is early enough that a
    # stack nobody sees is a bug nobody fixes. Off until somebody says otherwise, and an
    # ordinary dependency rather than an extra: an install that could be missing the half
    # that reports its own failures is an install whose failures are not reported.
    "sentry-sdk>=2.71.0",
    "textual>=8.2.8",
    # What an entry is added to a copy of Grok Build's `config.toml` with, for an account
    # behind a gateway: what the person at this machine wrote in theirs -- their comments and
    # their order among it -- is still there in the copy after an entry is.
    "tomlkit>=0.15.1",
    # A flow declares its agents and environments as TypedDicts open to more roles of one
    # type (PEP 728's `extra_items`), which no `typing` this package supports can say --
    # and a dependency the flow API imports is one it declares, whoever else brings it.
    "typing-extensions>=4.13",
]

# What three of the backends want from this Python environment, and nobody else does. Every
# other backend humanize drives is a CLI somebody installs for themselves, and humanize
# carries nothing for it; these three also want a package here, and two of them are not small --
# the DeepSeek runtime is a bundled executable, published as a wheel for three platforms and
# no others, so an ordinary dependency would be a machine humanize cannot be installed on at
# all, for the sake of a backend nobody there runs. Nothing below is imported where a module
# is read: the three drivers load them where a turn needs one, so `hmz` starts, lists its
# backends, and takes every other backend's turns with none of this installed. What is
# missing is said rather than crashed on -- the backend stays in the picker with the line
# that adds it.
[project.optional-dependencies]
# DeepSeek Harness is driven through its own Python SDK, which also brings the runtime its
# turns are taken on; and dsh reads a project's `.env` the way its own CLI does, which is
# somebody else's solved problem.
dsh = [
    # Held to the release the driver was read against, because the SDK is pre-release and
    # its surface moves: 0.1.2a3 replaced a whole composition handed over as `cordis` with a
    # profile and patches over it, and `coganchor/agents/dsh.py` drives the latter. Move this
    # only together with that driver, and with `DSH_SDK` in `coganchor/backends.py`, which is
    # what humanize tells somebody to install by hand.
    "deepseek-harness-sdk>=0.1.5rc1,<0.1.6",
    "python-dotenv>=1.2.3",
]
# Kimi Code's app server says what a session is doing over a websocket, which is how a turn
# is read back as it happens rather than a second at a time.
kimi = [
    "websockets>=15,<18",
]
# A model called directly rather than through a coding agent CLI: litellm is the one client
# that speaks every vendor's API, gateways and clouds alike, and it is a large install that only
# a flow with a `litellm` role needs. And the gateway it runs locally besides, which is what puts
# a coding agent CLI in front of an endpoint that CLI does not speak to itself.
#
# The gateway is litellm's own proxy, and what it needs is litellm's `[proxy]` extra -- written
# out here rather than named, because that extra also brings the proxy's command-line client,
# which holds `rich` below 14, and the interface here is on `rich` 15. The server imports none
# of it. So: every requirement of `litellm[proxy]` 1.105 but `rich` and `inquirerpy`, which are
# that client's alone, and `websockets`, which only its realtime endpoints import and which the
# `kimi` extra already brings at a release `litellm[proxy]` holds below. Move these together
# with the `litellm` they were read off, and with `LITELLM_SDK` in `coganchor/backends.py`.
litellm = [
    "litellm>=1.105",
    "apscheduler>=3.11.2,<4",
    "azure-identity>=1.25.2,<2",
    "azure-storage-blob>=12.28,<13",
    "backoff>=2.2.1,<3",
    "boto3>=1.43.1,<2",
    "cryptography>=49,<51",
    "expression>=5.6,<6",
    "fastapi>=0.136.3,<1",
    "fastapi-sso>=0.19,<1",
    "granian>=2.7.4,<3",
    "gunicorn>=23,<24",
    "hiredis>=3,<4",
    "httpx2>=2.5,<3",
    "litellm-enterprise>=0.1.73",
    "litellm-proxy-extras>=0.4.105",
    "mcp>=2.2,<3",
    "orjson>=3.11.6,<4",
    "polars>=1.38.1,<2",
    "pyjwt>=2.13,<3",
    "pynacl>=1.6.2,<2",
    "pyroscope-io>=0.8.16,<1; sys_platform != 'win32'",
    "python-multipart>=0.0.27,<1",
    "pyyaml>=6.0.3,<7",
    "restrictedpython>=8.5,<9",
    "rq>=2.7,<3",
    "soundfile>=0.12.1,<1",
    "starlette>=1.0.1,<2",
    "tomlkit>=0.13.3,<1",
    "uvicorn>=0.33,<1",
    "uvloop>=0.22.1,<1; sys_platform != 'win32'",
]
# All of them, for an install that would rather not choose.
all = [
    "hmz[dsh,kimi,litellm]",
]

[project.urls]
Homepage = "https://github.com/humanfia/humanize"
Documentation = "https://docs.humanfia.ai/humanize/"
Changelog = "https://github.com/humanfia/humanize/releases"
Source = "https://github.com/humanfia/humanize"
Issues = "https://github.com/humanfia/humanize/issues"

[project.scripts]
hmz = "hmz.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The web interface's page is driven in a real browser by `tests/system/web`: what it
    # draws and what it sends are only seen there.
    "playwright>=1.55",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8.0",
    # Exercises dsh's dotenv-compatible native configuration without making the SDK
    # itself part of every development environment.
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    # The suite drives a real websocket server at kimi's notification reader, and the type
    # checker reads that test like any other file. Here rather than in the `kimi` extra for
    # the same reason as the line above: what the tests need is not what an install needs.
    "websockets>=15,<18",
]

[tool.pytest.ini_options]
# `tests/system` runs real agents for minutes a test, so a plain `pytest` leaves it out;
# name a file under it to run one. AGENTS.md says when.
testpaths = ["tests/unit", "tests/integration"]
# The interface is an async application, and its tests drive it as one.
asyncio_mode = "auto"
# Tests are imported by path, so two directories may hold files of the same name; the root
# goes on the path for `tests.<...>` helper imports.
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-n",
    "auto",
]
# A ceiling on any one test that did not ask for its own with `@pytest.mark.timeout`.
timeout = 300

[tool.ruff]
# The formatter wraps at 88; `pycodestyle` below lets prose the formatter cannot
# split run to 100 rather than forcing a reflow of every docstring in the tree.
line-length = 88
# The Python in Markdown is left as written: a page lays its blocks out for the reader, and a
# spec's signatures are the spec. Only `ruff format` with no paths would reach them.
# And the sample project system tests set agents to work on, which is not this one's code.
extend-exclude = ["*.md", "tests/system/sample"]

[tool.ruff.lint]
# Everything, less what this codebase has a reason to be without. A rule is off
# here only where it argues with something the code does on purpose.
select = ["ALL"]
# The prompt glyph the interface draws, and the sign that means times.
allowed-confusables = ["❯", "×"]
ignore = [
    # The formatter owns trailing commas and implicit concatenation; linting them
    # too makes the two tools rewrite each other's lines.
    "COM812",
    "ISC001",
    # LICENSE says it once. A header per file says it a hundred and twenty times.
    "CPY001",
    # Google style documents a class where it is declared and leaves the class
    # docstring to cover __init__, dunders, and the one-line accessors.
    "D102",
    "D105",
    "D107",
    # Each subcommand imports what only it needs, so `hmz` starts without loading
    # the interface, the tracer, and the sandbox to run a command that uses none.
    "PLC0415",
    # `Any` is what a wire protocol carries. Pyright's strict mode governs the rest.
    "ANN401",
    # Between them these want an exception class per message. The messages are
    # one-offs and read better at the raise than three files away.
    "TRY003",
    "EM101",
    "EM102",
    # Every subprocess here is an argv list, never a shell string, and looking up
    # `ssh` or `docker` on PATH is the point rather than the oversight.
    "S603",
    "S607",
    # The counters. A reader of somebody else's stream format is one `match` over
    # the items that format has, and a launch takes what `execve` takes; splitting
    # either to bring a number down hides the shape of the thing being mirrored.
    # Set `mccabe.max-complexity` and the `pylint` maxima to put a ceiling back.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# The script that builds the throwaway world the documentation's terminal demos are
# recorded in. It is copied into a container and run by path rather than imported, so it
# is a file rather than a package, and there is nothing for an `__init__.py` to do.
"docs/tapes/stage.py" = ["INP001"]
# And the one that plays a tape into a terminal, run the same way, which says what it wrote.
"docs/tapes/cast.py" = ["INP001", "T201"]
# The syscall layer's domain type is the string path: it reads them out of ptrace
# registers and puts them on a wire, so `pathlib` would only convert them twice. Named
# rather than the whole of `coganchor`, which also holds the drivers and the facts about
# the CLIs they drive -- and those write a path the way everything else here does.
"src/hmz/coganchor/{anchor,argv,execproxy,handlers,netproxy,policy,proto,remote,shadow,standin,statepaths,supervisor,transport}.py" = [
    "PTH",
]
"src/hmz/coganchor/linux/**" = ["PTH"]
"src/hmz/coganchor/serve/**" = ["PTH"]
# The same, for the half of a redirected run that reads paths out of a tracee: what
# it holds is what the process itself named, byte for byte, and back again.
"src/hmz/coganchor/providers/_trace.py" = ["PTH"]
# A handle and the client it came off, a session and its agent: each pair is two
# halves of one object declared in one file, and the underscore keeps the halves
# out of the package's public surface rather than out of each other's.
"src/hmz/coganchor/remote.py" = ["SLF001"]
"src/hmz/coganchor/agents/base.py" = ["SLF001"]
"src/hmz/coganchor/agents/codex.py" = ["SLF001"]
"src/hmz/coganchor/agents/dsh.py" = ["SLF001"]
"src/hmz/coganchor/agents/kimi.py" = ["SLF001"]
"src/hmz/coganchor/agents/litellm.py" = ["SLF001"]
# And a watchdog and the session it is watching: it reads what the turn is riding and puts
# that transport down, which is the session's own inside rather than anybody else's.
"src/hmz/coganchor/agents/watchdog.py" = ["SLF001"]
# And a flow call and the views it hands a flow: the engine's half and the half a flow sees,
# each reaching into the other's slots, which the underscore keeps from flows.
"src/hmz/runtime/flowing/{engine,viewing}.py" = ["SLF001"]
# And the one module that changes Textual's parser from outside it: the ceiling and the two
# patterns it reads a sequence with are that parser's own, and changing them is the whole of
# what the module is for.
"src/hmz/tui/keyboard.py" = ["SLF001"]
# Looking for a flow is allowed to find nothing. `os.path` answers False for a
# directory it cannot read, and for a `~` with no home behind it, where `Path` raises;
# both modules say so where they reach for one -- `find` in one, `_own` in the other.
"src/hmz/runtime/flowing/finding.py" = ["PTH"]
"src/hmz/runtime/flowing/verses.py" = ["PTH"]
# The exceptions a flow catches are named for what happened -- `FlowNotFound`,
# `BudgetExceeded`, `TempCloneBusy` -- as the flow API's spec names them, rather than each
# given an `Error` suffix that would say only that they are exceptions.
"src/hmz/flows/errors.py" = ["N818"]
# What a command line writes, it prints.
"src/hmz/cli/**" = ["T201"]
# And so does a flow: what it prints is what its run shows whoever is watching. The flows
# humanize ships are written the way anybody's flow is, against what the flow API hands every
# one of them: the params and context a flow is called with whether or not it reads them, and
# a state that is read like a dict and has no `.get`.
"src/hmz/flows/builtin/**" = ["T201", "ARG001", "SIM401"]
"tests/**" = [
    "S101",    # an assert is what a test is
    "INP001",  # tests are imported by path (`--import-mode=importlib`), not as packages
    "PLR2004", # the literal a test compares against is the expectation
    "D1",      # the name of a test is what it documents
    "ARG",     # pytest passes a fixture by name, whether the body names it or not
    "FBT",     # a parametrized test takes its parameters however `parametrize` gives them
    "S105",    # a fake credential
    "S106",
    "S108",    # and a fake temp path
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
# The project the system tests set agents to work on, not this one's code.
exclude = ["tests/system/sample"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# As CI checks it, on any machine: the fences and the sandbox call what only Linux's `os`
# and `socket` have, catching the `AttributeError` elsewhere, which a check on a Mac refuses.
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
# The only checker here is pyright, so a suppression names a pyright rule.
# `# type: ignore[whatever]` silences the whole line whatever is in the brackets.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# A test uses what it tests the way any caller does: its public names alone. The root goes
# back on the path because a test names its helpers from the top: `tests.system.real`.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = "error"
# An autouse fixture is used by being declared, and nothing names it anywhere.
reportUnusedFunction = "none"

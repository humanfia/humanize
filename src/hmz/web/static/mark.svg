<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="humanize">
  <title>humanize</title>
  <!-- The prompt, `>_`, cut from flat planes: an ink chevron, and a pink wedge rising on the
       one diagonal. -->
  <style>
    .ink { fill: #1b1720; }
    .pink { fill: #d9508c; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f1e9ee; }
      .pink { fill: #ff8fbd; }
    }
  </style>
  <polygon class="ink" points="12,16 32,16 62,50 32,84 12,84 42,50"/>
  <polygon class="pink" points="60,84 94,84 94,64 60,74"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The mark on a tile of its own, so it holds up on a tab of either colour. -->
  <style>
    .tile { fill: #f4efe6; }
    .ink { fill: #16161a; }
    .red { fill: #d6331f; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #16161a; }
      .ink { fill: #ece6da; }
      .red { fill: #ff5a43; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="14"/>
  <polygon class="ink" points="10,14 31,14 63,50 31,86 10,86 42,50"/>
  <polygon class="red" points="60,86 96,86 96,62 60,73"/>
</svg>

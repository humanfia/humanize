<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img">
  <title>What happens when a limit is reached: a graceful limit lets the turn under way finish, a limit that is not graceful cuts it off at once.</title>
  <rect width="760" height="272" rx="12" fill="#172026"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
    <text x="24" y="109">Graceful</text>
    <text x="24" y="127" font-size="12" fill="#9aa9b0">the default</text>
    <text x="24" y="197">Not graceful</text>

    <g fill="#0f161a" stroke="#435058" stroke-width="1.5">
      <rect x="160" y="88" width="120" height="40" rx="8"/>
      <rect x="296" y="88" width="120" height="40" rx="8"/>
      <rect x="160" y="168" width="120" height="40" rx="8"/>
      <rect x="296" y="168" width="120" height="40" rx="8"/>
    </g>
    <rect x="432" y="88" width="200" height="40" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <rect x="432" y="168" width="128" height="40" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <rect x="648" y="88" width="88" height="40" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
    <rect x="576" y="168" width="88" height="40" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>

    <g text-anchor="middle">
      <text x="220" y="113">Turn 1</text>
      <text x="356" y="113">Turn 2</text>
      <text x="496" y="113" fill="#4fd8ea">Turn 3 finishes</text>
      <text x="692" y="113" fill="#e3b55a">Stopped</text>
      <text x="220" y="193">Turn 1</text>
      <text x="356" y="193">Turn 2</text>
      <text x="496" y="193" fill="#4fd8ea">Turn 3 cut off</text>
      <text x="620" y="193" fill="#e3b55a">Stopped</text>
      <text x="568" y="44" fill="#e3b55a">Limit reached</text>
    </g>
    <line x1="568" y1="56" x2="568" y2="232" stroke="#e3b55a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="24" y="250" font-size="12" fill="#b3c3c8">Either way, no new turn starts after the limit.</text>
  </g>
</svg>

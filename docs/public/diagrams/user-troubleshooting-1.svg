<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img">
  <title>Three logs: the app writes Humanize Desktop.log, the daemon writes daemon.log, and each run writes host.log in its epic's folder.</title>
  <rect width="760" height="280" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#5d6a72"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <g stroke-width="1.5">
      <rect x="32" y="40" width="200" height="56" rx="8" fill="#ffffff" stroke="#b3c3c8"/>
      <rect x="280" y="40" width="200" height="56" rx="8" fill="#e6f2cf" stroke="#5a8f00"/>
      <rect x="528" y="40" width="200" height="56" rx="8" fill="#d9f1f4" stroke="#0b7080"/>
      <rect x="32" y="152" width="200" height="48" rx="8" fill="#f6ecd2" stroke="#80590c"/>
      <rect x="280" y="152" width="200" height="48" rx="8" fill="#f6ecd2" stroke="#80590c"/>
      <rect x="528" y="152" width="200" height="48" rx="8" fill="#f6ecd2" stroke="#80590c"/>
    </g>
    <g text-anchor="middle">
      <text x="132" y="73">Humanize Desktop</text>
      <text x="380" y="73">The daemon</text>
      <text x="628" y="73">A run</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <text x="132" y="181">Humanize Desktop.log</text>
        <text x="380" y="181">daemon.log</text>
        <text x="628" y="181">host.log</text>
      </g>
      <g font-size="12" fill="#435058">
        <text x="132" y="224">Startup, installs, connections</text>
        <text x="380" y="224">Failures before any run</text>
        <text x="628" y="224">One in each epic's folder</text>
      </g>
    </g>
    <g stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M232 68H278"/>
      <path d="M480 68H526"/>
      <path d="M132 96V150"/>
      <path d="M380 96V150"/>
      <path d="M628 96V150"/>
    </g>
    <g font-size="12" fill="#5d6a72">
      <text x="140" y="128">writes</text>
      <text x="388" y="128">writes</text>
      <text x="636" y="128">writes</text>
    </g>
  </g>
</svg>

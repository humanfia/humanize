<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img">
<title>A role class declares a permission and skills; every session of the role runs its coding agent inside a fence for that permission, with those skills in its temporary home; derive gives the same agent a narrower grant</title>
<rect width="760" height="288" rx="12" fill="#172026"/>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<rect x="24" y="48" width="200" height="112" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="76">Your role class</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">
<text x="40" y="108">_permission</text>
<text x="40" y="136">_skills</text>
</g>

<path d="M224 104H318" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="272" y="92" text-anchor="middle" font-size="12" fill="#9aa9b0">every session</text>

<rect x="320" y="24" width="416" height="160" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="336" y="52" fill="#4fd8ea">Fence: paths and network</text>
<rect x="336" y="72" width="184" height="88" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="428" y="108" text-anchor="middle">Coding agent</text>
<text x="428" y="130" text-anchor="middle" font-size="12" fill="#b3c3c8">and every command it runs</text>
<rect x="536" y="72" width="184" height="88" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
<text x="628" y="108" text-anchor="middle">The role's skills</text>
<text x="628" y="130" text-anchor="middle" font-size="12" fill="#b3c3c8">in a temporary home</text>

<path d="M124 160V214" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="216" width="200" height="48" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="124" y="245" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.derive(...)</text>
<path d="M224 240H318" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="320" y="216" width="416" height="48" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="528" y="245" text-anchor="middle">Same agent: tighter fence, fewer skills</text>
</g>
</svg>

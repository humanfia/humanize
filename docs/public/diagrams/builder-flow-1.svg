<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img">
<title>What a run gives is checked against what @flow declares, and the function is handed the task, agents, envs, params and ctx</title>
<rect width="760" height="280" rx="12" fill="#f4f8f9"/>
<style>
.s{animation:s1 9s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,28%{opacity:0}34%,100%{opacity:1}}
@keyframes s3{0%,50%{opacity:0}56%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
<g class="s">
<rect x="24" y="48" width="192" height="184" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="76">The run gives</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#b83a72">
<text x="40" y="108">"Add a discount code"</text>
<text x="40" y="140">-a coder=claude/…</text>
<text x="40" y="172">-e …</text>
<text x="40" y="204">-p rounds=2</text>
</g>
</g>
<g class="s s2">
<path d="M216 140H270" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="272" y="48" width="216" height="184" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="288" y="76">Humanize checks it against</text>
<text x="288" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@flow(</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<text x="312" y="136">agents=Agents,</text>
<text x="312" y="164">envs=Envs,</text>
<text x="312" y="192">params=Params</text>
<text x="288" y="216">)</text>
</g>
</g>
<g class="s s3">
<path d="M488 140H542" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="544" y="48" width="192" height="184" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="560" y="76">The function is handed</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0b7080">
<text x="560" y="106">task</text>
<text x="560" y="132">agents</text>
<text x="560" y="158">envs</text>
<text x="560" y="184">params</text>
<text x="560" y="210">ctx</text>
</g>
<g font-size="12" fill="#435058">
<text x="632" y="106">the words</text>
<text x="632" y="132">one per role</text>
<text x="632" y="158">one per role</text>
<text x="632" y="184">validated</text>
<text x="632" y="210">this call</text>
</g>
</g>
</g>
</svg>

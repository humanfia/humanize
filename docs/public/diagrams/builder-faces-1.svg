<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img">
<title>A face: the flow's question reaches the face in a sandboxed frame as ask, the face answers with submit, and the answer passes the same schema check as the plain form before run returns</title>
<rect width="760" height="312" rx="12" fill="#f4f8f9"/>
<style>
.s{animation:s1 9s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,24%{opacity:0}30%,100%{opacity:1}}
@keyframes s3{0%,42%{opacity:0}48%,100%{opacity:1}}
@keyframes s4{0%,60%{opacity:0}66%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker>
<marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#80590c"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
<rect x="24" y="72" width="168" height="72" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="108" y="102" text-anchor="middle">Your flow</text>
<text x="108" y="124" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#435058">spawn(face=…)</text>

<rect x="264" y="24" width="272" height="216" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="280" y="52">Question card</text>
<rect x="280" y="72" width="240" height="72" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="296" y="102">Your face</text>
<text x="296" y="124" font-size="12" fill="#435058">sandboxed frame, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0b7080">window.hmz</tspan></text>
<rect x="280" y="168" width="240" height="56" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="296" y="192">Plain form</text>
<text x="296" y="212" font-size="12" fill="#435058">if picked, or the face fails</text>

<rect x="608" y="72" width="128" height="72" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="672" y="102" text-anchor="middle">Schema check</text>
<text x="672" y="124" text-anchor="middle" font-size="12" fill="#435058">same as the form</text>

<g class="s">
<path d="M192 108H278" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="232" y="98" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5d6a72">ask</text>
</g>

<g class="s s2">
<path d="M520 94H606" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="564" y="84" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5d6a72">submit</text>
<path d="M520 196H672V146" fill="none" stroke="#b3c3c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
</g>

<g class="s s3">
<path d="M608 124H522" fill="none" stroke="#80590c" stroke-width="1.5" marker-end="url(#g)"/>
<text x="564" y="142" text-anchor="middle" font-size="12" fill="#80590c">errors</text>
</g>

<g class="s s4">
<path d="M712 144V272H108V146" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="410" y="292" text-anchor="middle" font-size="12" fill="#5d6a72">it fits: run returns your model</text>
</g>
</g>
</svg>

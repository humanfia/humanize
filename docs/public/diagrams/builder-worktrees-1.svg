<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
  <title>From one workdir a flow derives a git worktree, a temporary copy and a scratch directory, and snapshots the workdir to rewind it later</title>
  <rect width="760" height="320" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5d6a72"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <rect x="24" y="40" width="208" height="64" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="128" y="68" text-anchor="middle" font-weight="600">The workdir</text>
    <text x="128" y="88" text-anchor="middle" font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/shop</text>

    <rect x="24" y="216" width="208" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
    <text x="128" y="244" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refs/hmz/snapshots/</text>
    <text x="128" y="264" text-anchor="middle" font-size="12" fill="#5a8f00">git refs · kept</text>

    <g fill="none" stroke="#5d6a72" stroke-width="1.5">
      <path d="M112 104V214" marker-end="url(#a)"/>
      <path d="M144 216V106" marker-end="url(#a)"/>
      <path d="M232 72H390" marker-end="url(#a)"/>
      <path d="M312 72V160H390" marker-end="url(#a)"/>
      <path d="M312 160V248H390" marker-end="url(#a)"/>
    </g>
    <g font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="104" y="164" text-anchor="end">snapshot()</text>
      <text x="152" y="164">rewind(ref)</text>
    </g>

    <g>
      <rect x="392" y="40" width="344" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
      <text x="408" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derive_worktree()</text>
      <text x="408" y="88" font-size="12" fill="#435058">A git worktree at a ref · <tspan fill="#5a8f00">kept</tspan></text>

      <rect x="392" y="128" width="344" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
      <text x="408" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derive_temp_clone(id)</text>
      <text x="408" y="176" font-size="12" fill="#435058">A copy of every file · <tspan fill="#80590c">removed when the flow ends</tspan></text>

      <rect x="392" y="216" width="344" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
      <text x="408" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">derive_scratch(id)</text>
      <text x="408" y="264" font-size="12" fill="#435058">An empty directory · <tspan fill="#80590c">removed when the flow ends</tspan></text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
<title>Each name in the flow file is what you type to run it: the file name after -f, the agent role after -a, the param after -p, and the workspace is the folder you run in</title>
<rect width="760" height="320" rx="12" fill="#f4f8f9"/>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
<text x="24" y="44" font-size="12" fill="#5d6a72">In the flow file</text>
<text x="456" y="44" font-size="12" fill="#5d6a72">When you run it</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect x="24" y="56" width="280" height="48" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="40" y="85">.hmz/flows/polish.py</text>
<rect x="24" y="120" width="280" height="48" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="40" y="149">coder: Agent</text>
<rect x="24" y="184" width="280" height="48" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="40" y="213">rounds: int = 2</text>
<rect x="24" y="248" width="280" height="48" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="40" y="277">workspace: LocalEnv</text>

<rect x="456" y="56" width="280" height="48" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="472" y="85" fill="#b83a72">-f polish</text>
<rect x="456" y="120" width="280" height="48" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="472" y="149" fill="#b83a72">-a coder=claude/…</text>
<rect x="456" y="184" width="280" height="48" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="472" y="213" fill="#b83a72">-p rounds=3</text>
</g>
<rect x="456" y="248" width="280" height="48" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="472" y="277">the folder you run in</text>
<g fill="none" stroke="#5d6a72" stroke-width="1.5">
<path d="M304 80H454" marker-end="url(#a)"/>
<path d="M304 144H454" marker-end="url(#a)"/>
<path d="M304 208H454" marker-end="url(#a)"/>
<path d="M304 272H454" marker-end="url(#a)"/>
</g>
<g font-size="12" fill="#5d6a72" text-anchor="middle">
<text x="380" y="72">the flow's name</text>
<text x="380" y="136">an agent role</text>
<text x="380" y="200">a param</text>
<text x="380" y="264">an environment</text>
</g>
</g>
</svg>

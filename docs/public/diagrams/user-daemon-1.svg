<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img">
<title>Every interface on a machine is a client of one daemon, which keeps one host process per workspace, chat or command-line run</title>
<rect width="760" height="328" rx="12" fill="#f4f8f9"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker></defs>
<text x="24" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">What you open</text>
<text x="296" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">Started on demand</text>
<text x="536" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">Holds the runs</text>
<rect x="24" y="64" width="200" height="40" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="89" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">Humanize Desktop</text>
<path d="M224 84L294 148" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="24" y="112" width="200" height="40" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#141a1f">hmz web</text>
<path d="M224 132L294 168" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="24" y="160" width="200" height="40" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#141a1f">hmz</text>
<path d="M224 180L294 188" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="24" y="208" width="200" height="40" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#141a1f">hmz exec, hmz chat</text>
<path d="M224 228L294 208" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="24" y="256" width="200" height="40" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="281" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">a Python program</text>
<path d="M224 276L294 228" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="296" y="120" width="168" height="136" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="316" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">The daemon</text>
<text x="316" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">one per machine</text>
<text x="316" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">and user</text>
<path d="M464 160L534 116" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="536" y="88" width="200" height="56" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="552" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Host</text>
<text x="552" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">the workspace ~/shop</text>
<path d="M464 188L534 188" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="536" y="160" width="200" height="56" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="552" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Host</text>
<text x="552" y="202" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">one chat</text>
<path d="M464 216L534 260" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="536" y="232" width="200" height="56" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="552" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Host</text>
<text x="552" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">one hmz exec run</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img">
<title>The nightly job: at 02:00 a runner takes the task and the sign-in secret from your repository, installs hmz and the agent CLI, runs the flow with hmz exec, exports the epic, and leaves a pull request, an artifact and a git backup</title>
<rect width="760" height="280" rx="12" fill="#f4f8f9"/>
<style>
.s{animation:s1 9s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}.s5{animation-name:s5}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,20%{opacity:0}26%,100%{opacity:1}}
@keyframes s3{0%,34%{opacity:0}40%,100%{opacity:1}}
@keyframes s4{0%,48%{opacity:0}54%,100%{opacity:1}}
@keyframes s5{0%,62%{opacity:0}68%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
<rect x="24" y="80" width="144" height="120" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="40" y="108">Your repository</text>
<g font-size="12" fill="#b83a72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text x="40" y="136">TASK.md</text>
<text x="40" y="156">ci/nightly.sh</text>
</g>
<text x="40" y="180" font-size="12" fill="#435058">a sign-in secret</text>

<g class="s">
<path d="M168 140H230" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="200" y="128" text-anchor="middle" font-size="12" fill="#5d6a72">02:00</text>
<rect x="232" y="40" width="312" height="200" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="248" y="68">Actions runner</text>
</g>

<g class="s s2">
<rect x="248" y="88" width="280" height="40" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="264" y="113">Install hmz and the agent CLI</text>
</g>

<g class="s s3">
<rect x="248" y="136" width="280" height="40" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="264" y="161"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0b7080">hmz exec</tspan> runs the flow</text>
</g>

<g class="s s4">
<rect x="248" y="184" width="280" height="40" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="264" y="209">Export the epic</text>
</g>

<g class="s s5">
<path d="M544 76H598" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M544 140H598" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M544 204H598" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="56" width="136" height="40" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="668" y="81" text-anchor="middle">Pull request</text>
<rect x="600" y="120" width="136" height="40" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="668" y="145" text-anchor="middle">Git backup</text>
<rect x="600" y="184" width="136" height="40" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="668" y="209" text-anchor="middle">Artifact</text>
</g>
</g>
</svg>

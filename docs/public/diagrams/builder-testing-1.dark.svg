<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img">
  <title>A test calls run_fake, which runs the flow in a private daemon with a scripted agent, an in-memory environment and a scripted person in place of the real ones</title>
  <rect width="760" height="312" rx="12" fill="#172026"/>
  <defs>
    <marker id="go" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4fd8ea"/>
    </marker>
    <marker id="back" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#a5d84a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
    <rect x="24" y="112" width="192" height="88" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
    <text x="40" y="142" font-weight="600">Your test</text>
    <text x="40" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">run_fake("fix", task)</text>
    <text x="24" y="232" font-size="12" fill="#b3c3c8">Then assert on what</text>
    <text x="24" y="250" font-size="12" fill="#b3c3c8">each fake recorded.</text>

    <rect x="328" y="24" width="168" height="264" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="344" y="52" font-weight="600">Private daemon</text>
    <text x="344" y="72" font-size="12" fill="#b3c3c8">in a temporary home</text>
    <rect x="344" y="120" width="136" height="72" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="412" y="161" text-anchor="middle">Your flow</text>

    <rect x="552" y="24" width="184" height="72" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="568" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FakeAgentDriver</text>
    <text x="568" y="76" font-size="12" fill="#b3c3c8">scripted turns</text>

    <rect x="552" y="120" width="184" height="72" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="568" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FakeEnvDriver</text>
    <text x="568" y="172" font-size="12" fill="#b3c3c8">files and commands</text>

    <rect x="552" y="216" width="184" height="72" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="568" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FakeOutworlder</text>
    <text x="568" y="268" font-size="12" fill="#b3c3c8">a scripted person</text>

    <g font-size="12" fill="#b3c3c8" text-anchor="middle">
      <text x="280" y="132">runs it</text>
      <line x1="220" y1="140" x2="340" y2="140" stroke="#4fd8ea" stroke-width="1.5" marker-end="url(#go)"/>
      <line x1="340" y1="172" x2="220" y2="172" stroke="#a5d84a" stroke-width="1.5" marker-end="url(#back)"/>
      <text x="280" y="190">result or error</text>
    </g>
    <g stroke="#4fd8ea" stroke-width="1.5" fill="none">
      <line x1="484" y1="144" x2="548" y2="64" marker-end="url(#go)"/>
      <line x1="484" y1="156" x2="548" y2="156" marker-end="url(#go)"/>
      <line x1="484" y1="168" x2="548" y2="248" marker-end="url(#go)"/>
    </g>
  </g>
</svg>

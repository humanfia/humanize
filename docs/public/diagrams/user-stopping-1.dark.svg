<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" role="img">
  <title>An epic goes from running to stopping to stopped; a force stop skips the wait</title>
  <rect width="760" height="224" rx="12" fill="#172026"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa9b0"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff94c2"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="44" font-size="16" font-weight="600" fill="#e8f0f2">What a stop does</text>

    <rect x="40" y="64" width="180" height="72" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="130" y="96" font-size="14" font-weight="600" text-anchor="middle" fill="#4fd8ea">Running</text>
    <text x="130" y="118" font-size="12" text-anchor="middle" fill="#b3c3c8">turns under way</text>

    <rect x="290" y="64" width="180" height="72" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
    <text x="380" y="96" font-size="14" font-weight="600" text-anchor="middle" fill="#e3b55a">Stopping</text>
    <text x="380" y="118" font-size="12" text-anchor="middle" fill="#b3c3c8">turns interrupted</text>

    <rect x="540" y="64" width="180" height="72" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="630" y="96" font-size="14" font-weight="600" text-anchor="middle" fill="#a5d84a">Stopped</text>
    <text x="630" y="118" font-size="12" text-anchor="middle" fill="#b3c3c8">nothing left open</text>

    <line x1="222" y1="100" x2="286" y2="100" stroke="#ff94c2" stroke-width="1.5" marker-end="url(#p)"/>
    <text x="254" y="90" font-size="12" font-weight="600" text-anchor="middle" fill="#ff94c2">Stop</text>

    <line x1="472" y1="100" x2="536" y2="100" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="504" y="90" font-size="12" text-anchor="middle" fill="#9aa9b0">unwinds</text>

    <path d="M380 138 C380 184, 630 184, 630 140" fill="none" stroke="#ff94c2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#p)"/>
    <text x="505" y="196" font-size="12" text-anchor="middle" fill="#ff94c2"><tspan font-weight="600">Force stop</tspan>: sessions closed at once</text>
  </g>
</svg>

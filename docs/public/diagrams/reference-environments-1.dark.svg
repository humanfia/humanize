<text x="84.0" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">role</text>
<text x="140" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#b3c3c8">=</text>
<rect x="152" y="40" width="88" height="40" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>

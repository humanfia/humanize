<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
  <title>Hmz().run() with roles given as text has the machine's daemon hold the epic, which is kept; with a role given as an object, a private daemon inside your process holds it, and the epic is removed at the end</title>
  <rect width="760" height="320" rx="12" fill="#172026"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#9aa9b0"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2" text-anchor="middle">
    <rect x="32" y="40" width="184" height="96" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
    <text x="124" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Hmz().run(...)</text>
    <text x="124" y="108" font-size="12" fill="#b3c3c8">every role given as text</text>

    <rect x="336" y="40" width="168" height="96" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="420" y="84">Machine daemon</text>
    <text x="420" y="108" font-size="12" fill="#b3c3c8">the one the app uses</text>

    <rect x="592" y="40" width="136" height="96" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="660" y="84">Epic</text>
    <text x="660" y="108" font-size="12" fill="#b3c3c8">kept on disk</text>

    <rect x="32" y="184" width="184" height="96" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
    <text x="124" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Hmz().run(...)</text>
    <text x="124" y="252" font-size="12" fill="#b3c3c8">a role given as an object</text>

    <rect x="336" y="184" width="168" height="96" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="420" y="228">Private daemon</text>
    <text x="420" y="252" font-size="12" fill="#b3c3c8">inside your process</text>

    <rect x="592" y="184" width="136" height="96" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
    <text x="660" y="228">Epic</text>
    <text x="660" y="252" font-size="12" fill="#b3c3c8">removed at the end</text>

    <g fill="none" stroke="#9aa9b0" stroke-width="1.5">
      <path d="M216 88H334" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M504 88H590" marker-end="url(#a)"/>
      <path d="M216 232H334" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M504 232H590" marker-end="url(#a)"/>
    </g>
    <g font-size="12" fill="#9aa9b0">
      <text x="276" y="76">start, follow</text>
      <text x="548" y="76">holds</text>
      <text x="276" y="220">start, follow</text>
      <text x="548" y="220">holds</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img">
<title>Where a line said to a running flow goes: into the agent's open turn, or it waits pinned until that agent's next turn starts</title>
<rect width="760" height="264" rx="12" fill="#f4f8f9"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker></defs>
<rect x="24" y="104" width="136" height="56" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="92" y="137" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f" text-anchor="middle">You say a line</text>
<path d="M160 132H192V68H223" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M160 132H192V196H223" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="224" y="40" width="176" height="56" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="240" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f" text-anchor="start">Turn open</text>
<text x="240" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72" text-anchor="start">the agent is working</text>
<rect x="224" y="168" width="176" height="56" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="240" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f" text-anchor="start">No turn open</text>
<text x="240" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72" text-anchor="start">between turns</text>
<path d="M400 68H535" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="468" y="58" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058" text-anchor="middle">taken mid-turn</text>
<path d="M400 196H535" stroke="#5d6a72" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="468" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058" text-anchor="middle">pinned</text>
<path d="M440 68V180H535" stroke="#5d6a72" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="450" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#80590c" text-anchor="start">refused</text>
<rect x="536" y="40" width="200" height="56" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="552" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f" text-anchor="start">Into this turn</text>
<text x="552" y="82" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058" text-anchor="start">the agent carries on with it</text>
<rect x="536" y="168" width="200" height="56" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
<text x="552" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f" text-anchor="start">Waits for the next turn</text>
<text x="552" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058" text-anchor="start">that turn starts with it</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
<title>Three agents of one CLI, each running as a different account with its own credentials</title>
<rect width="760" height="320" rx="12" fill="#172026"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker></defs>
<text x="24" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e8f0f2">One CLI, three accounts at once</text>
<text x="24" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#9aa9b0">Agent</text>
<text x="288" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#9aa9b0">Account</text>
<text x="504" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#9aa9b0">Credentials, under ~/.hmz/</text>
<rect x="24" y="96" width="208" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="40" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e8f0f2">claude@work/MODEL</text>
<path d="M232 124H286" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="288" y="96" width="160" height="56" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="304" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e8f0f2">work</text>
<text x="304" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b3c3c8">made by key</text>
<path d="M448 124H502" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="504" y="96" width="232" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="520" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e8f0f2">providers/claude/work/</text>
<rect x="24" y="168" width="208" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="40" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e8f0f2">claude@personal/MODEL</text>
<path d="M232 196H286" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="288" y="168" width="160" height="56" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="304" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e8f0f2">personal</text>
<text x="304" y="210" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b3c3c8">made by token</text>
<path d="M448 196H502" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="504" y="168" width="232" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="520" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e8f0f2">providers/claude/personal/</text>
<rect x="24" y="240" width="208" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="40" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e8f0f2">claude/MODEL</text>
<path d="M232 268H286" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="288" y="240" width="160" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="304" y="264" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e8f0f2">Local</text>
<text x="304" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b3c3c8">signed in elsewhere</text>
<path d="M448 268H502" stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="504" y="240" width="232" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="520" y="273" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#b3c3c8">the CLI's own sign-in</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img">
  <title>A gateway account points the CLI at your endpoint; a LiteLLM account puts a local proxy between the CLI and the vendor</title>
  <rect width="760" height="288" rx="12" fill="#172026"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9aa9b0"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
    <text x="24" y="44" font-weight="600">Gateway account</text>
    <rect x="24" y="56" width="168" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="108" y="89" text-anchor="middle">Coding CLI</text>
    <line x1="192" y1="84" x2="294" y2="84" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="244" y="74" text-anchor="middle" font-size="12" fill="#ff94c2">your URL + key</text>
    <rect x="296" y="56" width="192" height="56" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
    <text x="392" y="80" text-anchor="middle">Your endpoint</text>
    <text x="392" y="99" text-anchor="middle" font-size="12" fill="#b3c3c8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gateway.example</text>
    <line x1="488" y1="84" x2="590" y2="84" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="592" y="56" width="144" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="664" y="89" text-anchor="middle">Its models</text>

    <text x="24" y="172" font-weight="600">LiteLLM account</text>
    <rect x="24" y="184" width="168" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="108" y="217" text-anchor="middle">Coding CLI</text>
    <line x1="192" y1="212" x2="294" y2="212" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="244" y="202" text-anchor="middle" font-size="12" fill="#b3c3c8">random key</text>
    <rect x="296" y="184" width="192" height="56" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="392" y="208" text-anchor="middle">LiteLLM proxy</text>
    <text x="392" y="227" text-anchor="middle" font-size="12" fill="#b3c3c8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">127.0.0.1</text>
    <line x1="488" y1="212" x2="590" y2="212" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="540" y="202" text-anchor="middle" font-size="12" fill="#ff94c2">your real key</text>
    <rect x="592" y="184" width="144" height="56" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="664" y="217" text-anchor="middle">Any vendor</text>
    <text x="392" y="262" text-anchor="middle" font-size="12" fill="#9aa9b0">started by Humanize for the agent</text>
  </g>
</svg>

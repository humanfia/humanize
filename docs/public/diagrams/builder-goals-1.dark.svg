<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img">
<title>One run with a /goal prompt: the harness works turn after turn until the agent judges the objective met, then run returns the last message</title>
<rect width="760" height="280" rx="12" fill="#172026"/>
<style>
.s{animation:s1 9s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,24%{opacity:0}30%,100%{opacity:1}}
@keyframes s3{0%,42%{opacity:0}48%,100%{opacity:1}}
@keyframes s4{0%,62%{opacity:0}68%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
<marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#4fd8ea"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<rect x="24" y="72" width="184" height="72" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="116" y="102" text-anchor="middle">Your flow, one call</text>
<text x="116" y="124" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">run("/goal …")</text>

<g class="s">
<path d="M208 108H262" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="264" y="32" width="296" height="160" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="280" y="60">The harness's own goal command</text>
<rect x="280" y="84" width="112" height="48" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="336" y="113" text-anchor="middle">Works a turn</text>
</g>

<g class="s s2">
<path d="M392 108H446" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="448" y="84" width="96" height="48" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="496" y="113" text-anchor="middle">Met?</text>
</g>

<g class="s s3">
<path d="M496 132V160H336V134" fill="none" stroke="#4fd8ea" stroke-width="1.5" marker-end="url(#c)"/>
<text x="416" y="180" text-anchor="middle" font-size="12" fill="#4fd8ea">not yet: another turn</text>
</g>

<g class="s s4">
<path d="M544 108H598" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="572" y="96" text-anchor="middle" font-size="12" fill="#9aa9b0">met</text>
<rect x="600" y="72" width="136" height="72" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
<text x="668" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">run</text>
<text x="668" y="124" text-anchor="middle" font-size="12" fill="#b3c3c8">returns the last text</text>
</g>

<path d="M412 192V214" fill="none" stroke="#435058" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="264" y="216" width="296" height="40" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
<text x="412" y="241" text-anchor="middle" font-size="12" fill="#e3b55a">Every turn spends the epic's budget</text>
</g>
</svg>

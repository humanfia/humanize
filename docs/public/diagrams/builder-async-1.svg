<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img">
  <title>Three sessions take a turn at the same time; gather returns when the last one ends, and a fourth session then sums up</title>
  <rect width="760" height="272" rx="12" fill="#f4f8f9"/>
  <style>
    .a { animation: a 8s infinite }
    .b { animation: b 8s infinite }
    .c { animation: c 8s infinite }
    @keyframes a { 0%, 4% { opacity: 0 } 12%, 100% { opacity: 1 } }
    @keyframes b { 0%, 44% { opacity: 0 } 52%, 100% { opacity: 1 } }
    @keyframes c { 0%, 56% { opacity: 0 } 64%, 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#5d6a72"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#435058">
    <text x="32" y="93">session 1</text>
    <text x="32" y="133">session 2</text>
    <text x="32" y="173">session 3</text>
    <text x="32" y="213">session 4</text>
  </g>
  <g stroke="#b3c3c8" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M152 56V232"/>
    <path class="b" d="M488 56V232"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0b7080">
    <text x="152" y="44">gather starts</text>
    <text class="b" x="488" y="44" text-anchor="middle">gather returns</text>
  </g>
  <g class="a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#141a1f">
    <rect x="152" y="76" width="224" height="24" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="164" y="92">shop/catalogue.py</text>
    <rect x="152" y="116" width="336" height="24" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="164" y="132">shop/cart.py</text>
    <rect x="152" y="156" width="272" height="24" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="164" y="172">shop/checkout.py</text>
  </g>
  <g class="c">
    <rect x="504" y="196" width="208" height="24" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
    <text x="516" y="213" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">sum up the reviews</text>
  </g>
  <path d="M152 240H724" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#tip)"/>
  <text x="728" y="258" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">time</text>
</svg>

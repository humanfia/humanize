<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img">
<title>Steering a turn under way: queued, the agent finishes its step and then takes the words; not queued, the step is cut and the turn goes on from the words</title>
<rect width="760" height="264" rx="12" fill="#172026"/>
<defs>
<marker id="p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ff94c2"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<text x="24" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">queued=True</text>
<text x="272" y="48" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">steer()</text>
<path d="M272 56V78" fill="none" stroke="#ff94c2" stroke-width="1.5" marker-end="url(#p)"/>
<rect x="24" y="80" width="160" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="104" y="105" text-anchor="middle">a step</text>
<rect x="192" y="80" width="160" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="272" y="105" text-anchor="middle">this step finishes</text>
<rect x="360" y="80" width="376" height="40" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="548" y="105" text-anchor="middle">then the agent takes your words</text>

<text x="24" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">queued=False</text>
<text x="272" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">steer()</text>
<path d="M272 176V198" fill="none" stroke="#ff94c2" stroke-width="1.5" marker-end="url(#p)"/>
<rect x="24" y="200" width="160" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="104" y="225" text-anchor="middle">a step</text>
<rect x="192" y="200" width="80" height="40" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
<text x="232" y="225" text-anchor="middle" fill="#e3b55a">cut</text>
<rect x="280" y="200" width="456" height="40" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="508" y="225" text-anchor="middle">the turn goes on from your words</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img">
<title>The loop: the actor works on the goal, a fresh reviewer returns a verdict, notes go back to the actor until the verdict is approved or the rounds run out</title>
<rect width="760" height="264" rx="12" fill="#172026"/>
<style>
.s{animation:s1 9s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,24%{opacity:0}30%,100%{opacity:1}}
@keyframes s3{0%,44%{opacity:0}50%,100%{opacity:1}}
@keyframes s4{0%,64%{opacity:0}70%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<rect x="24" y="48" width="120" height="64" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="84" y="76" text-anchor="middle">Your task</text>
<text x="84" y="96" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">/goal …</text>

<g class="s">
<path d="M144 80H206" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="208" y="48" width="144" height="64" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="280" y="76" text-anchor="middle">Actor</text>
<text x="280" y="96" text-anchor="middle" font-size="12" fill="#b3c3c8">keeps one session</text>
</g>

<g class="s s2">
<path d="M352 80H438" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="396" y="68" text-anchor="middle" font-size="12" fill="#9aa9b0">the change</text>
<rect x="440" y="48" width="144" height="64" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="512" y="76" text-anchor="middle">Reviewer</text>
<text x="512" y="96" text-anchor="middle" font-size="12" fill="#b3c3c8">fresh, read-only</text>
</g>

<g class="s s3">
<path d="M512 112V176H280V114" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="396" y="164" text-anchor="middle" font-size="12" fill="#9aa9b0">notes: the next prompt</text>
<rect x="208" y="200" width="376" height="40" rx="8" fill="#3a3017" stroke="#e3b55a" stroke-width="1.5"/>
<text x="396" y="225" text-anchor="middle" font-size="12" fill="#e3b55a">after <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rounds</tspan> rounds the flow returns <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">False</tspan></text>
</g>

<g class="s s4">
<path d="M584 80H646" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<text x="616" y="68" text-anchor="middle" font-size="12" fill="#9aa9b0">approved</text>
<rect x="648" y="48" width="88" height="64" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
<text x="692" y="76" text-anchor="middle">Done</text>
<text x="692" y="96" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#a5d84a">True</text>
</g>
</g>
</svg>

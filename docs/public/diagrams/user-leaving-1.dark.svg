<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img">
<title>Windows attach to an epic that the daemon holds; closing a window does not stop the epic</title>
<rect width="760" height="312" rx="12" fill="#172026"/>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<text x="24" y="44" font-size="12" fill="#9aa9b0">What you open and close</text>
<text x="328" y="44" font-size="12" fill="#9aa9b0">What keeps running</text>

<rect x="24" y="64" width="208" height="48" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="93">Humanize Desktop</text>
<rect x="24" y="128" width="208" height="48" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="157">The browser page</text>
<rect x="24" y="192" width="208" height="48" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmz</text>
<text x="76" y="221" fill="#b3c3c8">in a terminal</text>

<rect x="328" y="64" width="408" height="176" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="344" y="92" font-weight="600">The daemon</text>
<text x="344" y="112" font-size="12" fill="#b3c3c8">one per machine and user</text>

<rect x="344" y="136" width="376" height="88" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="360" y="164" fill="#4fd8ea" font-weight="600">Host of</text>
<text x="414" y="164" fill="#4fd8ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/shop</text>
<text x="360" y="188" fill="#b3c3c8">The epic: the flow and its agents</text>
<text x="360" y="208" font-size="12" fill="#b3c3c8">goes on with no window attached</text>

<g stroke="#9aa9b0" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M232 88H280V152H342"/>
<path d="M232 168H342"/>
<path d="M232 216H280V184H342"/>
</g>
<text x="24" y="280" font-size="12" fill="#b3c3c8">Closing a window only detaches it. Open any of them again to attach.</text>
</g>
</svg>

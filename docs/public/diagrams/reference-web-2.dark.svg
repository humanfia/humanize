<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img">
  <title>The page reaches the local daemon through /rpc, a remote daemon through /dial, and a remote daemon over WebRTC without hmz web</title>
  <rect width="760" height="296" rx="12" fill="#172026"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#4fd8ea"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2" text-anchor="middle">
    <rect x="24" y="40" width="144" height="206" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
    <text x="96" y="140" font-weight="600">The page</text>
    <text x="96" y="160" font-size="12" fill="#b3c3c8">in your browser</text>

    <rect x="280" y="40" width="184" height="152" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
    <text x="372" y="64" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmz web</text>
    <rect x="296" y="76" width="152" height="28" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="372" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/rpc</text>
    <rect x="296" y="146" width="152" height="28" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
    <text x="372" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/dial</text>

    <rect x="576" y="62" width="160" height="56" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="656" y="86" font-weight="600">Local daemon</text>
    <text x="656" y="104" font-size="12" fill="#b3c3c8">on this machine</text>

    <rect x="576" y="142" width="160" height="104" rx="8" fill="#27351a" stroke="#a5d84a" stroke-width="1.5"/>
    <text x="656" y="190" font-weight="600">Remote daemon</text>
    <text x="656" y="208" font-size="12" fill="#b3c3c8">on another machine</text>

    <g stroke="#4fd8ea" stroke-width="1.5" fill="none">
      <path d="M168 90H294" marker-end="url(#a)"/>
      <path d="M448 90H574" marker-end="url(#a)"/>
      <path d="M168 160H294" marker-end="url(#a)"/>
      <path d="M448 160H574" marker-end="url(#a)"/>
      <path d="M168 226H574" marker-end="url(#a)"/>
    </g>
    <text x="224" y="82" font-size="12" fill="#b3c3c8">WebSocket</text>
    <text x="224" y="152" font-size="12" fill="#b3c3c8">WebSocket</text>
    <text x="520" y="82" font-size="12" fill="#b3c3c8">its socket</text>
    <text x="520" y="134" font-size="12" fill="#b3c3c8">ssh, wsl, tcp, ws,</text>
    <text x="520" y="150" font-size="12" fill="#b3c3c8">easytier, relay</text>
    <text x="372" y="218" font-size="12" fill="#b3c3c8">WebRTC, opened by the browser itself</text>
    <text x="380" y="274" font-size="12" fill="#9aa9b0">Each path carries bytes unchanged. JSON-RPC runs inside.</text>
  </g>
</svg>

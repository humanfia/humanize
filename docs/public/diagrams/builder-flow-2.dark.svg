<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" role="img">
<title>A bare flow name is looked up nearest first: the project's flows, then yours, then official, then the other flowverses</title>
<rect width="760" height="232" rx="12" fill="#172026"/>
<style>
.s{animation:s1 8s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,24%{opacity:0}30%,100%{opacity:1}}
@keyframes s3{0%,42%{opacity:0}48%,100%{opacity:1}}
@keyframes s4{0%,60%{opacity:0}66%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<text x="24" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#ff94c2">-f tidy</text>
<text x="96" y="48" fill="#b3c3c8">is looked up nearest first</text>
<g class="s">
<rect x="24" y="80" width="152" height="80" rx="8" fill="#12343b" stroke="#4fd8ea" stroke-width="1.5"/>
<text x="100" y="108" text-anchor="middle">1  This project</text>
<text x="100" y="136" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#b3c3c8">.hmz/flows/</text>
<text x="100" y="192" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#4fd8ea">@local/tidy</text>
</g>
<g class="s s2">
<path d="M176 120H206" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="208" y="80" width="152" height="80" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="284" y="108" text-anchor="middle">2  You</text>
<text x="284" y="132" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#b3c3c8">~/.local/share/</text>
<text x="284" y="148" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#b3c3c8">humanize/flows/</text>
<text x="284" y="192" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9aa9b0">@user/tidy</text>
</g>
<g class="s s3">
<path d="M360 120H390" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="392" y="80" width="152" height="80" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="468" y="108" text-anchor="middle">3  Official</text>
<text x="468" y="136" text-anchor="middle" font-size="12" fill="#b3c3c8">installed flows</text>
<text x="468" y="192" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9aa9b0">tidy</text>
</g>
<g class="s s4">
<path d="M544 120H574" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="576" y="80" width="160" height="80" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="656" y="108" text-anchor="middle">4  Other flowverses</text>
<text x="656" y="136" text-anchor="middle" font-size="12" fill="#b3c3c8">installed, A to Z</text>
<text x="656" y="192" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9aa9b0">@theirs/tidy</text>
</g>
</g>
</svg>

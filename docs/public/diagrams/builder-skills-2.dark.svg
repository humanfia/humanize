<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img">
<title>The rules of a permission in order, the preset's first; for each path the last rule that matches decides: /etc/hosts is read, ./shop/cart.py is written, ./vendor/pay.py is read, ~/.ssh/id_ed25519 is not touched</title>
<rect width="760" height="288" rx="12" fill="#172026"/>
<style>
.s{animation:s1 8s infinite both}
.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,5%{opacity:0}11%,100%{opacity:1}}
@keyframes s2{0%,22%{opacity:0}28%,100%{opacity:1}}
@keyframes s3{0%,39%{opacity:0}45%,100%{opacity:1}}
@keyframes s4{0%,56%{opacity:0}62%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9aa9b0"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#e8f0f2">
<text x="24" y="44">Rules, in order</text>
<text x="424" y="44">The last rule that matches decides</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect x="24" y="64" width="264" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="40" y="89">read_only("/")</text>
<rect x="24" y="116" width="264" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="40" y="141">allow(".")</text>
<rect x="24" y="168" width="264" height="40" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="193">read_only("./vendor")</text>
<rect x="24" y="220" width="264" height="40" rx="8" fill="#3b1f2c" stroke="#ff94c2" stroke-width="1.5"/>
<text x="40" y="245">deny("~/.ssh")</text>
</g>
<g font-size="12" fill="#9aa9b0" text-anchor="end">
<text x="276" y="89">preset</text>
<text x="276" y="141">preset</text>
</g>

<g class="s">
<path d="M288 84H422" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="64" width="312" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="440" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/etc/hosts</text>
<text x="720" y="89" text-anchor="end" fill="#4fd8ea">read</text>
</g>
<g class="s s2">
<path d="M288 136H422" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="116" width="312" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="440" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./shop/cart.py</text>
<text x="720" y="141" text-anchor="end" fill="#a5d84a">write</text>
</g>
<g class="s s3">
<path d="M288 188H422" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="168" width="312" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="440" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">./vendor/pay.py</text>
<text x="720" y="193" text-anchor="end" fill="#4fd8ea">read</text>
</g>
<g class="s s4">
<path d="M288 240H422" fill="none" stroke="#9aa9b0" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="220" width="312" height="40" rx="8" fill="#0f161a" stroke="#435058" stroke-width="1.5"/>
<text x="440" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/.ssh/id_ed25519</text>
<text x="720" y="245" text-anchor="end" fill="#e3b55a">none</text>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img">
  <title>Humanize Desktop carries the page and reaches each daemon through a pipe; the daemons hold the epics</title>
  <rect width="760" height="288" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#0b7080"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <rect x="24" y="40" width="200" height="184" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="124" y="124" text-anchor="middle" font-weight="600">Humanize Desktop</text>
    <text x="124" y="148" text-anchor="middle" font-size="12" fill="#435058">the page, built in</text>

    <rect x="456" y="40" width="280" height="72" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
    <text x="596" y="72" text-anchor="middle" font-weight="600">Local daemon</text>
    <text x="596" y="94" text-anchor="middle" font-size="12" fill="#435058">holds your chats and epics</text>

    <rect x="456" y="152" width="280" height="72" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
    <text x="596" y="184" text-anchor="middle" font-weight="600">Daemons on other machines</text>
    <text x="596" y="206" text-anchor="middle" font-size="12" fill="#435058">each holds its own</text>

    <path d="M224 76H454" stroke="#0b7080" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <text x="340" y="64" text-anchor="middle" font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hmz daemon connect --stdio</text>

    <path d="M224 188H454" stroke="#0b7080" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <text x="340" y="176" text-anchor="middle" font-size="12" fill="#435058">ssh, tcp, ws, relay, EasyTier</text>

    <text x="380" y="260" text-anchor="middle" font-size="12" fill="#5d6a72">Quitting the app closes the pipes. The daemons and their epics keep running.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
  <title>What a round remembers: fresh sessions share only the repository; one long session also keeps the conversation</title>
  <rect width="760" height="320" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5d6a72"/>
    </marker>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0b7080"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <text x="24" y="44" font-size="16" font-weight="600">What a round remembers</text>

    <text x="24" y="92">Fresh session per round</text>
    <text x="24" y="112" font-size="12" fill="#5d6a72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spawn() in the loop</text>
    <g fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5">
      <rect x="232" y="72" width="152" height="48" rx="8"/>
      <rect x="408" y="72" width="152" height="48" rx="8"/>
      <rect x="584" y="72" width="152" height="48" rx="8"/>
    </g>
    <g text-anchor="middle" fill="#0b7080">
      <text x="308" y="101">session 1</text>
      <text x="484" y="101">session 2</text>
      <text x="660" y="101">session 3</text>
    </g>

    <rect x="232" y="152" width="504" height="40" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
    <text x="484" y="177" text-anchor="middle" fill="#5a8f00">The repository: files and commits</text>
    <g stroke="#5d6a72" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
      <path d="M308 124 V148"/>
      <path d="M484 124 V148"/>
      <path d="M660 124 V148"/>
      <path d="M484 196 V220"/>
    </g>

    <text x="24" y="252">One long session</text>
    <text x="24" y="272" font-size="12" fill="#5d6a72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spawn() before the loop</text>
    <rect x="232" y="224" width="504" height="72" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5">
      <rect x="248" y="240" width="128" height="40" rx="8"/>
      <rect x="420" y="240" width="128" height="40" rx="8"/>
      <rect x="592" y="240" width="128" height="40" rx="8"/>
    </g>
    <g text-anchor="middle" fill="#435058">
      <text x="312" y="265">turn 1</text>
      <text x="484" y="265">turn 2</text>
      <text x="656" y="265">turn 3</text>
    </g>
    <g stroke="#0b7080" stroke-width="1.5" marker-end="url(#c)">
      <path d="M380 260 H416"/>
      <path d="M552 260 H588"/>
    </g>
  </g>
</svg>

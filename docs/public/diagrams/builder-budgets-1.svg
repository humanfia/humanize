<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img">
  <title>Three budgets, one inside the other: the epic's, a called flow's and one turn's. A turn is held to the tightest limit of the three, and what it spends counts against all of them.</title>
  <rect width="760" height="304" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0b7080"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <rect x="24" y="24" width="448" height="256" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
    <text x="40" y="50" font-weight="600">The epic's budget</text>
    <text x="40" y="70" font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-p budget.cost=5</text>

    <rect x="48" y="88" width="400" height="168" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
    <text x="64" y="114" font-weight="600">A called flow's budget</text>
    <text x="64" y="134" font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">await polish(…, budget=Budget(cost=1))</text>

    <rect x="72" y="152" width="352" height="80" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="88" y="180" font-weight="600">One turn's budget</text>
    <text x="88" y="202" font-size="12" fill="#435058" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">await coder.run(…, budget=Budget(…))</text>

    <text x="504" y="52" font-size="16" font-weight="600">The tightest limit wins</text>
    <text x="504" y="78" font-size="12" fill="#435058">A turn is held to every budget</text>
    <text x="504" y="96" font-size="12" fill="#435058">around it.</text>

    <line x1="512" y1="236" x2="512" y2="140" stroke="#0b7080" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="528" y="176" font-size="12" fill="#435058">What it spends in cost and</text>
    <text x="528" y="194" font-size="12" fill="#435058">tokens counts against all</text>
    <text x="528" y="212" font-size="12" fill="#435058">three.</text>
  </g>
</svg>

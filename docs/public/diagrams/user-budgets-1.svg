<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img">
  <title>What happens when a limit is reached: a graceful limit lets the turn under way finish, a limit that is not graceful cuts it off at once.</title>
  <rect width="760" height="272" rx="12" fill="#f4f8f9"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
    <text x="24" y="109">Graceful</text>
    <text x="24" y="127" font-size="12" fill="#5d6a72">the default</text>
    <text x="24" y="197">Not graceful</text>

    <g fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5">
      <rect x="160" y="88" width="120" height="40" rx="8"/>
      <rect x="296" y="88" width="120" height="40" rx="8"/>
      <rect x="160" y="168" width="120" height="40" rx="8"/>
      <rect x="296" y="168" width="120" height="40" rx="8"/>
    </g>
    <rect x="432" y="88" width="200" height="40" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <rect x="432" y="168" width="128" height="40" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <rect x="648" y="88" width="88" height="40" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
    <rect x="576" y="168" width="88" height="40" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>

    <g text-anchor="middle">
      <text x="220" y="113">Turn 1</text>
      <text x="356" y="113">Turn 2</text>
      <text x="496" y="113" fill="#0b7080">Turn 3 finishes</text>
      <text x="692" y="113" fill="#80590c">Stopped</text>
      <text x="220" y="193">Turn 1</text>
      <text x="356" y="193">Turn 2</text>
      <text x="496" y="193" fill="#0b7080">Turn 3 cut off</text>
      <text x="620" y="193" fill="#80590c">Stopped</text>
      <text x="568" y="44" fill="#80590c">Limit reached</text>
    </g>
    <line x1="568" y1="56" x2="568" y2="232" stroke="#80590c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="24" y="250" font-size="12" fill="#435058">Either way, no new turn starts after the limit.</text>
  </g>
</svg>

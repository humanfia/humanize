<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" role="img">
<title>A typed turn: the model goes to the agent as a JSON Schema, and the agent's last message is read back as the model or raises OutputSchemaError</title>
<rect width="760" height="296" rx="12" fill="#f4f8f9"/>
<style>
.s{animation:show 9s infinite both}
.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
@keyframes s1{0%,6%{opacity:0}12%,100%{opacity:1}}
@keyframes s2{0%,22%{opacity:0}28%,100%{opacity:1}}
@keyframes s3{0%,40%{opacity:0}46%,100%{opacity:1}}
@keyframes s4{0%,58%{opacity:0}64%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5d6a72"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">
<rect x="24" y="64" width="144" height="64" rx="8" fill="#fbe3ee" stroke="#b83a72" stroke-width="1.5"/>
<text x="96" y="92" text-anchor="middle">Your model</text>
<text x="96" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#b83a72">Check</text>

<g class="s s1">
<path d="M168 96H262" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="216" y="84" text-anchor="middle" font-size="12" fill="#5d6a72">JSON Schema</text>
<rect x="264" y="64" width="144" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="336" y="92" text-anchor="middle">Agent</text>
<text x="336" y="112" text-anchor="middle" font-size="12" fill="#435058">takes the turn</text>
</g>

<g class="s s2">
<path d="M408 96H502" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="456" y="84" text-anchor="middle" font-size="12" fill="#5d6a72">last message</text>
<rect x="504" y="32" width="232" height="128" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="520" y="60">hmz reads it, in order</text>
<g font-size="12" fill="#435058">
<text x="520" y="88">1  the whole text</text>
<text x="520" y="112">2  each fenced code block</text>
<text x="520" y="136">3  first <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{</tspan> to last <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">}</tspan></text>
</g>
</g>

<g class="s s3">
<path d="M544 160V214" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="532" y="192" text-anchor="end" font-size="12" fill="#5d6a72">one fits: run returns</text>
<rect x="504" y="216" width="80" height="48" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="544" y="245" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Check</text>
</g>

<g class="s s4">
<path d="M664 160V214" fill="none" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<text x="676" y="192" font-size="12" fill="#5d6a72">none: raises</text>
<rect x="592" y="216" width="144" height="48" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
<text x="664" y="244" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#80590c">OutputSchemaError</text>
</g>
</g>
</svg>

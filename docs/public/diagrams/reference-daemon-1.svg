<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img">
<title>A session in layers: a carrier, its security, then frames carrying JSON-RPC</title>
<rect width="760" height="344" rx="12" fill="#f4f8f9"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6a72"/></marker></defs>
<rect x="24" y="40" width="240" height="80" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
<text x="40" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Trusted carriers</text>
<text x="40" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#435058" xml:space="preserve">unix:  stdio:local</text>
<text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#435058" xml:space="preserve">stdio:ssh  stdio:wsl</text>
<line x1="264" y1="80" x2="302" y2="80" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="304" y="48" width="208" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="320" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">No extra layer</text>
<text x="320" y="96" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">frames sent directly</text>
<line x1="512" y1="80" x2="550" y2="80" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="136" width="240" height="80" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
<text x="40" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Untrusted carriers</text>
<text x="40" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#435058" xml:space="preserve">tcp://  ws://  wss://</text>
<text x="40" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#435058" xml:space="preserve">easytier:  relay:</text>
<line x1="264" y1="176" x2="302" y2="176" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="304" y="144" width="208" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="320" y="172" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">Mutual TLS 1.3</text>
<text x="320" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">pinned to the daemon id</text>
<line x1="512" y1="176" x2="550" y2="176" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="232" width="240" height="80" rx="8" fill="#f6ecd2" stroke="#80590c" stroke-width="1.5"/>
<text x="40" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Browser carrier</text>
<text x="40" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#435058" xml:space="preserve">webrtc:</text>
<line x1="264" y1="272" x2="302" y2="272" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="304" y="240" width="208" height="64" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
<text x="320" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#141a1f">DTLS data channel</text>
<text x="320" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5d6a72">pinned to the daemon id</text>
<line x1="512" y1="272" x2="550" y2="272" stroke="#5d6a72" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="552" y="40" width="184" height="272" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
<text x="568" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">Frames</text>
<text x="568" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">4-byte length, one JSON</text>
<line x1="568" y1="160" x2="720" y2="160" stroke="#0b7080" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="568" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#141a1f">JSON-RPC 2.0</text>
<text x="568" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0b7080">session.hello</text>
<text x="568" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#435058">first, then any method</text>
</svg>

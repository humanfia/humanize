<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img">
  <title>The four places Humanize keeps files: the home, the machine directory, a workspace, and a backup target</title>
  <rect width="760" height="320" rx="12" fill="#f4f8f9"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0b7080"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="24" y="24" width="224" height="136" rx="8" fill="#e6f2cf" stroke="#5a8f00" stroke-width="1.5"/>
    <text x="40" y="52" font-size="14" font-weight="600" fill="#141a1f">Home</text>
    <text x="40" y="76" font-size="12" fill="#141a1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/.hmz/</text>
    <text x="40" y="104" font-size="12" fill="#435058">Settings, accounts, flows,</text>
    <text x="40" y="122" font-size="12" fill="#435058">epics and chats.</text>
    <text x="40" y="144" font-size="12" fill="#5d6a72">Kept until you delete it</text>

    <rect x="268" y="24" width="224" height="136" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
    <text x="284" y="52" font-size="14" font-weight="600" fill="#141a1f">Machine directory</text>
    <text x="284" y="76" font-size="12" fill="#141a1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;tmp&gt;/humanize-&lt;uid&gt;/</text>
    <text x="284" y="104" font-size="12" fill="#435058">Daemon socket and log,</text>
    <text x="284" y="122" font-size="12" fill="#435058">caches.</text>
    <text x="284" y="144" font-size="12" fill="#5d6a72">Made again when missing</text>

    <rect x="512" y="24" width="224" height="136" rx="8" fill="#ffffff" stroke="#b3c3c8" stroke-width="1.5"/>
    <text x="528" y="52" font-size="14" font-weight="600" fill="#141a1f">Workspace</text>
    <text x="528" y="76" font-size="12" fill="#141a1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;workspace&gt;/.hmz/</text>
    <text x="528" y="104" font-size="12" fill="#435058">This project's own flows.</text>
    <text x="528" y="144" font-size="12" fill="#5d6a72">Yours; never removed</text>

    <path d="M136 160 V214" fill="none" stroke="#0b7080" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="148" y="192" font-size="12" fill="#0b7080">backup</text>

    <rect x="24" y="216" width="468" height="80" rx="8" fill="#d9f1f4" stroke="#0b7080" stroke-width="1.5"/>
    <text x="40" y="244" font-size="14" font-weight="600" fill="#141a1f">Backup target (a git repository)</text>
    <text x="40" y="270" font-size="12" fill="#141a1f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;machine&gt;/&lt;workspace&gt;/&lt;epic&gt;/</text>
  </g>
</svg>
